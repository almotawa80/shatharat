<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أحسن ظنك بالناس واحترس منهم، ولا تكن أهبلا يمتخط بكمه، فبعض حسن الظن ورطة، وبعض سوء الظن من الفِطَن، فإذا عمت الأمانة والصدق فسوء الظن إثم، وإذا تفشى الكذب والخيانة فسوء الظن من الحزم والعزم.</p><p><a href="../#s/m3800">افتح في شذرات</a></p></body></html>
