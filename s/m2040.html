<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أسرع طريق للصعود أن تُعَقِّب على عالم مشهور مُبدع، بدليل واضح مُقنع، بقول ظريف، وأُسلوب لطيف، وأدب شريف، وتتكرر الانتقادات الإيجابية، مشفوعة بالثناء على صاحب القول، بإسلوب فصيح، وبرهان صحيح، وقول نصيح.</p><p><a href="../#s/m2040">افتح في شذرات</a></p></body></html>
