<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">العينان دليلان، والأذنان مخبران، واللسان ترجمان، واليدان آلتا معالجة وعمل، والرجلان آلتا مواصلة وحمل، والعقل آلة كف ولجام، والبطن وعاء الوقود والطاقة، والحواس أجهزة استكشاف وتعرف، والقلب ملك الجوارح.</p><p><a href="../#s/m1084">افتح في شذرات</a></p></body></html>
