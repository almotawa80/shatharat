<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">كل علم أو فن أو صناعة أو مهنة أو حرفة يُسأل عنها أهلها وعلماؤها وخبراؤها؛ فما قال عنه علماء الحديث بأن هذا الحديث صحيح فهو صحيح، وما قالوا عنه بأنه ضعيف فهو ضعيف.</p><p><a href="../#s/m3483">افتح في شذرات</a></p></body></html>
