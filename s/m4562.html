<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">قد لا يُستباح المنكر بتغيير الفعل، وإنما بتغيير اسمه؛ فإذا تغير الاسم هان الفعل، وإذا هان أُلِف، وإذا أُلِف استُبيح، حتى يصبح المنكر معروفًا والمعروف منكرًا.</p><p><a href="../#s/m4562">افتح في شذرات</a></p></body></html>
