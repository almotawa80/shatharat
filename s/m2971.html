<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">عندما تراعي حق المتكلم ، وتستمع إليه باهتمام ، وهو يقص عليك قصة طويلة ، ليس لها رأس ولا ذنب ، ولا عبارات جميلة ولا أدب ، وناهيك لو كنت سامعها ، فقد تحملت حملا ثقيلا على نفسك ، وهذا يدل على حسن أدبك ، وجمال طبعك ،وروعة مشاعرك.</p><p><a href="../#s/m2971">افتح في شذرات</a></p></body></html>
