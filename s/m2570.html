<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">القروب يحوي الرسائل والآراء والفديوهات والتغريدات، لا يستطيع المشارك أن يتابع كل الآراء والمقولات، لكن أهم شيء أن يكون الحوار والنقاش في ظل الأدب والاحترام، وبعيد عن الخشونة والاتهام، فلا يلوح بالفزاعة، فيعكر صفو الجماعة، فإنها بئست البضاعة.</p><p><a href="../#s/m2570">افتح في شذرات</a></p></body></html>
