<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من يستطيع أن يخلق السموات والأرض وما بينهما في ستة أيام، يستطيع أن يأتي بمثل القرآن، لأن الخالق هو القائل، والقائل هو الخالق، فإن كان الإنسان لا يستطيع أن يخلق ذبابة، فهو لا يستطيع أن يأتي بسورة من مثله، ولو كانت ثلاث آيات فقط.</p><p><a href="../#s/m2001">افتح في شذرات</a></p></body></html>
