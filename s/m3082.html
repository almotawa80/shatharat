<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">اتصل الحارس بسيده وقال له : لا تُسافر اليوم ، لأنى رأيت البارحة في المنام أن الطائرة سوف تقع ، فألغى رحلته ، ثم جاءت الأخبار بسقوط الطائرة ، فحمدالله ، ثم شكر حارسه وقدم له مكافأة جزلة ، ثم أنهى خدمته . س : لماذا أنهى خدمته ؟</p><p><a href="../#s/m3082">افتح في شذرات</a></p></body></html>
