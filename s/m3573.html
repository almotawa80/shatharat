<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">جميع من في الديوانية استقبلوا أبا فهد بالتبريكات والمعانقات، بهنئونه بالزواج بالثانية، تعجب منهم وقال ما حصل ، قالوا : شايفينك مع واحدة صغيرة في السوق أمس ، قال هذه أم فهد عملت لها إعادة تدوير ، قالوا : كيف ؟ قال : سفرتها مع أخيها إلى منتجع صحي</p><p><a href="../#s/m3573">افتح في شذرات</a></p></body></html>
