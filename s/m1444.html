<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">تتعرّف على شخصية الإنسان من خلال: دينه وأخلاقه: لتعرف ظاهره وباطنه. كلامه: فحديثه يكشف فكره وطباعه. سلوكه: فالأفعال أصدق من الأقوال. تعامله مع الآخرين: خصوصًا مع من دونه، ومع من لا مصلحة له معهم. رده في المواقف الصعبة: فالشدة تكشف المعادن. اختياره لأصدقائه: فالمرء على دين خليله.</p><p><a href="../#s/m1444">افتح في شذرات</a></p></body></html>
