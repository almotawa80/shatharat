<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">القضاء العادل ما تواطأت على تأييده الخاصة والعامة، ولم تُنكره النفوس، وانشرحت له الصدور، ورضيه العلماء والدهماء، ولم يستوحشه العقلاء، وكان مرضيا للأتقياء، ولم يتنافى مع مكارم الأخلاق، والقضاء الجائر ما خالف كل ذلك، والمؤمنون شهداء الله في الأرض، وكلام الحق على لسان الصالحين من الخلق.</p><p><a href="../#s/m3322">افتح في شذرات</a></p></body></html>
