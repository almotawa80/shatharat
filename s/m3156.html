<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">دخل محل فاكِهاني فاختار من كل نوع أفضل ثمرة ، وهكذا ينبغي للعاقل أن يقتبس من كل أحد يلتقي به أفضل ما لديه من علم أو خُلق أو خبرة أو حكمة ، حتى يتكون لديه رصيد من المعرفة والثقافة ، فيكون رجلا بارزا مُميزا في العلم والثقافة ، واللياقة واللباقة والأناقة.</p><p><a href="../#s/m3156">افتح في شذرات</a></p></body></html>
