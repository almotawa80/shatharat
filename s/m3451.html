<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">عَظَمة الفرد ليست بِعِظم جسده وطول قامته، ولكن بصفاء نيته وكثرة علمه، وجمال طبعه وأدبه، وكذلك عظمة الدولة ليست بكثرة سكانها، وكبر مساحتها؛ ولكن بكثرة علمائها ومفكريها، وعدالة قوانينها والالتزام بتطبيقها.</p><p><a href="../#s/m3451">افتح في شذرات</a></p></body></html>
