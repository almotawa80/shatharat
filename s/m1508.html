<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">كثيرٌ من الناس إذا سمع بفاكهة أو عصير فيه فوائد، بالغ في تناوله كما وكيفًا، حتى تنقلب الفائدة ضررًا؛ والنصيحة: خذ من الطعام والشراب بقدر، ولا تُسرف فتجلب الضرر؛ فالاعتدال دواء، والإفراط خطر وداء.</p><p><a href="../#s/m1508">افتح في شذرات</a></p></body></html>
