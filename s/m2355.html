<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الصفات المجبول عليها الإنسان تُوَرَّث لا مظاهرها، فقد يكون الأب شجاعا مجرما، فيكون ابنه شجاعا في قول الحق ونصرة المظلوم، فورث من أبيه صفة الشجاعة ولم يرث منه مظاهرها (الإجرام ) لأنه تربى في وسط صالح، فوظف شجاعته في الإيجابيات لا في السلبيات.</p><p><a href="../#s/m2355">افتح في شذرات</a></p></body></html>
