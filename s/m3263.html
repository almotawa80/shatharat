<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">بعض الرؤساء في المناصب والمراكز والشركات والوزارات والحكومات والهيئات والجمعيات وغيرها ؛ مثل الضرس الذي نخر السوس في جذوره ، فبلغ العطب إلى العصب ، فبقاؤه آلام وإزعاج ، وخلعه راحة وانفراج ، فما له علاج إلا الخلع بعد التخدير والبنج.</p><p><a href="../#s/m3263">افتح في شذرات</a></p></body></html>
