<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إن قلت لرجل : ما شاء الله ! نصف قومك كرماء سيسعد ، وإن قلت له: مع الأسف، نصف قومك بخلاء سيغضب ، فالمعنى واحد ، فعلى العاقل أن يختار التعبير الأنسب للمعنى ، والأفضل للبيان ، والأجمل في الآذان والجَنان.</p><p><a href="../#s/m2887">افتح في شذرات</a></p></body></html>
