<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">يا أهل النور إذا رأيتم جهازا أو نورا يعمل من غير حاجة فأطفئوه، نوَّر الله قبوركم وقلوبكم ووجوهكم بنور الإيمان وطاعة الرحمن، فالطاقة الكهربائية؛ في أصلها نعمة وهبية، فاشكروا الله عليها، ولا تُسرفوا فيها، فإنه لا يحب المسرفين.</p><p><a href="../#s/m2666">افتح في شذرات</a></p></body></html>
