<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">عند الاضطراب الأمني يُخزّن الناس حاجاتهم في البيوت، أما في حال الأمن، فاعتبروا كل ما في الجمعيات ملكًا لكم، يصل إليكم بالهاتف متى شئتم. فلا داعي للمبالغات في كثرة الثلاجات- والفريزرات- وكثرة المعاناة، وفساد بعض المخزونات.</p><p><a href="../#s/m1510">افتح في شذرات</a></p></body></html>
