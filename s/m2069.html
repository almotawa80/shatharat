<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا يزال الناس بخير ما تواصلوا، وأعان غنيهم فقيرهم، ودعا فقيرهم لغنيهم، وعطف كبيرهم على صغيرهم، ووقر صغيرهم كبيرهم، وإذا تواصل ذوو الأرحام فيما بينهم وتراحموا، عمهم الله برحمته، وبارك لهم في أرزاقهم وأعمارهم، وإذا تقاطعوا وتدابروا، فقد حرموا أنفسهم من بركات الله في التواصل.</p><p><a href="../#s/m2069">افتح في شذرات</a></p></body></html>
