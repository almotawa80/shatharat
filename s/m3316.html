<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أفضل حكومة في العالم: هي أقل دولة فيها اختلاسات وعمولات ومحسوبيات وتزوير جنسيات ومشروعات فاشلة وغسيل أموال واستئثار بالمميزات والتفاف على القوانين ومصادرة الحريات، لأنه لا توجد حكومة خالية من العيوب والتقصيرات، ولا يوجد شعب راضيا عن حكومته تمام الرضا، فالحكومة كالثومة ماكولة ومذمومة.</p><p><a href="../#s/m3316">افتح في شذرات</a></p></body></html>
