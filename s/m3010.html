<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إذا أكثر الكلب النباح ، صار نباحه لا معنى له . وإذا أكثر الرجل الوعود والأقوال ولم يُصدقها بالوفاء والأفعال ؛ كانت وعوده لا معنى لها ، وصار مثل الحكومات الفاشلة.</p><p><a href="../#s/m3010">افتح في شذرات</a></p></body></html>
