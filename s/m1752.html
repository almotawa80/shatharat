<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا تَشْكُ مَن يرحمك إلى مَن لا يرحمك، فإن الله إذا أحب عبدًا ابتلاه، وقد قال النبي صلى الله عليه وسلم: “أشدُّ الناس بلاءً الأنبياء، ثم الأمثل فالأمثل”. فالبلاء يمسّ أحباب الله؛ ليمحّصهم، ويرفع درجاتهم، ويسمع دعاءهم، ويضاعف أجورهم، وليكونوا قدوة لغيرهم في الصبر والثبات.</p><p><a href="../#s/m1752">افتح في شذرات</a></p></body></html>
