<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">عندما ذهبت إلى العين استصغرت البئر، وعندما ذهبت إلى النهر استصغرت العين، وعندما ذهبت إلى البحر استصغرت النهر، وهكذا العلماء، ولن تتعصب للعالم وتعرف أخطاءه حتى تُجالس عالما غيره، وفوق كل ذي علم عليم، والله بكل شيء عليم.</p><p><a href="../#s/m3874">افتح في شذرات</a></p></body></html>
