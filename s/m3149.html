<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أول كتاب في حياتي تصفحته ، وتأملته ، وقرأته ، وفهمته وحفظته ، واقتبست منه ، وتلقيت عنه ، وتلقنت منه ، وتعلمت منه ، هو وجه أُمي ، كانت أُمي حاضنتي وحضانتي ومدرستي ومربيتي ، أطال الله بقاءها بصحة وعافية وحسن عمل.</p><p><a href="../#s/m3149">افتح في شذرات</a></p></body></html>
