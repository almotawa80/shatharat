<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">قال رجلٌ لزوجته: خلقكنَّ اللهُ جميلات، لكنكنَّ ناقصاتِ عقل. فابتسمتْ وقالت: خلقنا اللهُ جميلاتٍ لتميلوا إلينا، وناقصاتِ عقلٍ لنميلَ إليكم، فتكتمِل الأُلفة والمحبّةُ بين الطرفين.</p><p><a href="../#s/m1623">افتح في شذرات</a></p></body></html>
