<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">طوبى لمن طَوَّع نفسه لطاعة الله ، وتدرج معها في فعل الخيرات وترك المنكرات ، وحب المساكين ، والعطف على اليتيم ، فانقادت له بعد امتناع ، وتبعته عن اقتناع ، وويل لمن قادته نفسه لطاعة هواه والشهوات ، وفعل المحرمات والمنكرات ، وترك الطاعات والصلوات.</p><p><a href="../#s/m3236">افتح في شذرات</a></p></body></html>
