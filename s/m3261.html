<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">ليس المشيمة وغشاؤها فقط لو اجتمع العلماء ما استطاعوا أن يصنعوا مثلها ، بل كل جزئية وخلية في الجنين وأُمه لو اجتمع كل العلماء ما استطاعوا أن يصنعوا مثلها ، فالله هو الخالق والخلاق العظيم ، فليخلقوا ذبابة أو بعوضة أو نملة أو حبة قمح أو شعير ، فسبحان الله العظيم.</p><p><a href="../#s/m3261">افتح في شذرات</a></p></body></html>
