<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">التعايش والتكيُّف والتلاؤم، من موجبات تيسير الحياة، وتخفيف المعاناة، واكتساب القوة النفسية والحسية التي تُعين على التحمل والتصبر، واستمرار دوران عجلة الحياة، لتحقيق مصالح ومنافع الإنسان، واتقاء المفاسد والمضار.</p><p><a href="../#s/m1965">افتح في شذرات</a></p></body></html>
