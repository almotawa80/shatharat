<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">ما هي المعاملة الأمثل مع زوجتك: أكرمها في نفسها وأهلها. استوصِ بها خيرًا، فهي أمانة. عاملها باللين، واحتمل تقصيرها. امدح، ولا تكثر اللوم. أشعرها بالأمان، تُعطيك الحنان. تذكّر: أن حسن الخُلق أثقل ما يوضع في ميزان العبد يوم القيامة. وأولى الناس بحسن أخلاقك، من يسكن معك في بيتك.</p><p><a href="../#s/m1774">افتح في شذرات</a></p></body></html>
