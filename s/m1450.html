<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الرجل أوتي بنية جسدية أقوى، وصبرا على المشقة، وميلا للاقتحام والمخاطرة، فكان أقدر على الكسب والسعي. والمرأة جُبلت على الرقة، والصبر، والحنان، وحسن الاحتواء، فكانت أقدر على التربية ورعاية شؤون البيت. فسبحان من أعطى كل نفس هداها، وأعانها على القيام بشؤون دينها ودنياها.</p><p><a href="../#s/m1450">افتح في شذرات</a></p></body></html>
