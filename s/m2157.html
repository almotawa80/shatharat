<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">حق الوالدين يلي حق الله ورسوله مباشرة، إذ أمر الله ببرهما بعد توحيده. هما بابان إلى الجنة، فمن برهما نال رضا الله. ومع ذلك، لا طاعة لهما في الشرك أو المعصية، مما يعزز أهمية برهما في كل ما سوى ذلك.</p><p><a href="../#s/m2157">افتح في شذرات</a></p></body></html>
