<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">دخل الزوج على زوجته وهو في غاية الحزن والكآبة، فقالت له: سلامات! خير إن شاء الله، قال لها بصوت حزين: ضاع الحمار، فقالت له: لا تحزن، فوالله لدخلتك علينا سالما أحسن من ألف حمار.</p><p><a href="../#s/m1627">افتح في شذرات</a></p></body></html>
