<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">يُولد الأطفال مزوّدين بالحواس الخمس: السمع البصر اللمس الذوق الشم، وهي نوافذهم إلى الإدراك، وجسورهم إلى الفهم والمعرفة. فواجب الوالدين أن يُشبِعوا هذه الحواس بما ينفعهم في دينهم ودنياهم، وفي أخلاقهم وآدابهم، وبما يقربهم من الله، ويرفع شأنهم عند الناس.</p><p><a href="../#s/m1371">افتح في شذرات</a></p></body></html>
