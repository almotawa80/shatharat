<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">في بعض البلدان يسير السارق دون قلق ويكسب السياسي المال دون عرق وينام المسؤول الفاشل دون أرق ويغادر المختلس البلد دون فَرَق ويتولى المناصب من دون شهادات وورق وتُنجز المعاملات بالرشوة والملق ويأكل الفقير الرز دون مرق لأن القانون فيها حبر على ورق.</p><p><a href="../#s/m2821">افتح في شذرات</a></p></body></html>
