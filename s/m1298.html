<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">يكثر الغش في المدن أكثر من القرى؛ لأن القرى تضبطها السمعة، والمدن تحكمها المصلحة. ففي القرى تردعك العيون، وفي المدن تُغريك الظنون؛ هناك تُعرف فتُحاسَب، وهنا تُجهل فتُغرَى. فإذا غابت الرقابة وضعف الضمير، استشرى الغش واستوطن الخداع والتحايل.</p><p><a href="../#s/m1298">افتح في شذرات</a></p></body></html>
