<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لاحظ السُجناء أن واحدا منهم يُعامله السَّجَّان بشيء من الرفق واللين ، وكان السبب أنه إذا أرسل رسالة إلى أهله ، يذكر في آخرها ، أن السجَّان يُعامله معاملة حسنة ، لأنه يعلم أن السجَّان يقرأ رسالته ، بخلاف السُجَناء فإنهم يكتبون الذم والقدح في السَّجَّانين</p><p><a href="../#s/m2972">افتح في شذرات</a></p></body></html>
