<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">القانون هو ابن الجريمة، فالمجرمون هم الذين يدفعون أهل القانون لكتابته. كلما ظهرت جريمة جديدة، اضْطُرَّ القضاة إلى سن قانون جديد يردعها. فالجرائم هي التي تشكل حدود القانون وتوسع إطاره، لتظل العدالة في مواجهة دائمة مع فوضى المخالفات والتجاوزات والجرائم.</p><p><a href="../#s/m1823">افتح في شذرات</a></p></body></html>
