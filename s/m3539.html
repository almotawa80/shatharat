<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">دخل أعرابي مكتبة كبيرة فيها كتب كثيرة تنطح السقف، فعجب من كثرة الكتب، ثم قال:أنا أعرف كل ما في هذه الكتب، فتعجب الناس فقالوا له ما فيها: فقال: فيها أيها الإنسان كن إنسانا صالحا ولا تكن إنسانا فاسدا</p><p><a href="../#s/m3539">افتح في شذرات</a></p></body></html>
