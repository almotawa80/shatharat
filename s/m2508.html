<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا مانع عقلا ونقلا وعادة وعرفا، من تقديم النصيحة والمشورة للحاكم التي فيها مصلحته ومصلحة الرعية والوطن، بالقول اللين الصريح، وعدم التشهير والتجريح، مع التوقير والتقدير، فصلاح الحاكم صلاح للرعية، وغش الحاكم غش للرعية.</p><p><a href="../#s/m2508">افتح في شذرات</a></p></body></html>
