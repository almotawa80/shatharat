<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الرجال ثلاثة : رجل رجل، ورجل نصف رجل، ورجل لا رجل : فالأول : ذو الرأي والمشورة، والثاني : له رأي ولا يشاور، أو يشاور ولا رأي له، والثالث : لا رأي له ولا يشاور.</p><p><a href="../#s/m456">افتح في شذرات</a></p></body></html>
