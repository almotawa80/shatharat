<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">كفرانُ العشيرِ: ثمرةُ لحظةٍ غلبت فيها العاطفةُ الذاكرة؛ فيغيب تاريخُ الإحسان بزلةٍ حاضرة، ويُقاس العمرُ بالموقف الحاضر، فإذا ثقلت التوقّعات واشتدّ الضغط، ضاق ميزانُ العدل، فرُئي النقصُ وغاب الفضل، والعلاجُ تذكيرُ العقل بما نسيه الشعور.</p><p><a href="../#s/m1293">افتح في شذرات</a></p></body></html>
