<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">جميع أفراد الأُسرة يجتمعون ليلة الجمعة في بيت الجدة ، وكل واحدة من بناتها تأتي بطبق أو طبقين ، مما لذَّ وطاب ، فيصبح بيت الجدة معول من معاول الرجيم ، فبيت الجدة مقبرة الرجيم ، فالرجيم يُولد يوم السبت ؛ ويدفن ليلة الجمعة ، وهكذا دواليك.</p><p><a href="../#s/m3937">افتح في شذرات</a></p></body></html>
