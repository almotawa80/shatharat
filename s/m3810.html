<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أي مصلحة تجارية ولو كانت مهنتها مثالية وإنسانية، كالمستشفيات والعيادات، يكون عمود خيمتها، ونظام عملها، وتنظيم إجراءاتها، وعقيدة هدفها، هي الربحية والمبالغة في جمع المال وتكثيرة، ثم يتفاوتون في درجات الطمع والجشع، هذا هو الأصل العام، وقد يكون هناك استثناءت طفيفة.</p><p><a href="../#s/m3810">افتح في شذرات</a></p></body></html>
