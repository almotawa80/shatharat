<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا تعاهدوا الله تعالى وإن كان ولا بُد فعاهدوا أنفسكم فلأن تغدروا بأنفسكم خير لكم من أن تغدروا بعهد الله تعالى ، فكان عهد الله مسؤولا ، وكان الإنسان ظلوما جهولا كسولا.</p><p><a href="../#s/m4059">افتح في شذرات</a></p></body></html>
