<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الأبُ عزٌّ لا يُجارى، وسندٌ لا يُبارى، هو نورُ الدار، ودرعُ الأخطار، رضاهُ فوز، ودعاؤه لأولاده مستجاب، وكلامه لأبنائه نصح وصواب، وصمته وقار وهيبة لأهل الدار، ولكل ابن مطيع بار.</p><p><a href="../#s/m1357">افتح في شذرات</a></p></body></html>
