<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الصقور تُعرَف بحدّة بصرها وسرعة انقضاضها، لا بزُخرُف ألوانها ولا ببهاءِ هيئتها. وكلاب الصيد تُمدَح ببأسها وسرعتها وخَطْفها، لا بجمال خِلقتها. والأسود تُهاب بأنيابها ومخالبها، لا بجلودها ولَبَدِها. والرجال تُكرَم بسخائها ومروءتها، وسموّ أخلاقها ونُبل سجاياها، لا بجمال مظهرها وهندامها.</p><p><a href="../#s/m1425">افتح في شذرات</a></p></body></html>
