<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أقسام الإخوان أربعة : منهم يعين ويستعين، ومنهم لا يعين ولا يستعين، فهذان سواء، فهذه بتلك. ومنهم من يستعين ولا يعين، فهذا أرذلها. ومنهم من يعين ولا يستعين، فهذا أفضلها.</p><p><a href="../#s/m736">افتح في شذرات</a></p></body></html>
