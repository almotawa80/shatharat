<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لتحيا سعيداً تخلَّ عن خصال الشر: الكفر والظلم والعدوان والغرور والبخل وما شاكلها. وتمسَّك بخصال الخير: الإيمان والعفو والإحسان والقناعة والكرم والتواضع وما شاكلها. فصفات الخير تجلب السعادة وتطرد الشقاء، وصفات الشر تجلب الشقاء وتطرد السعادة.</p><p><a href="../#s/m1837">افتح في شذرات</a></p></body></html>
