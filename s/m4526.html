<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لما أسنّ الأسد وعجز عن الصيد، أقام في عرينه وأمر شبله بإبلاغ الحيوانات بمرضه، وطلب زيارتهم فرادى. كان كل من يدخل لعيادته يصبح طعامه. وحين جاء دور الثعلب، وقف عند باب العرين وقال: “أرى آثار الدخول، ولا أرى آثار الخروج”، فنجا بعقله وذكائه.</p><p><a href="../#s/m4526">افتح في شذرات</a></p></body></html>
