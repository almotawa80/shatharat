<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">اتفاق الطبيبين أزكى من رأي الطبيب الفرد ، واتفاق الأطباء أزكى من اتفاق الطبيبين ، والأفضل أن لا يُؤخذ الرأي الطبي من طبيب فذ،وبالأخص في الأمراض النادرة والخطيرة ، بل يُؤخذ من اتفاق مجموعة أطباء خبراء مختصين.</p><p><a href="../#s/m3972">افتح في شذرات</a></p></body></html>
