<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الأطفال يبتسمون عندما يكونون سعداء، والأُم تبتسم عندما تراهم سعداء، ولو كانت حزينة، فسعادة الوالدين مرهونة بسعادة أولادهما، وسعادتهما أعظم من سعادتهم. فإن من عناية الله بالأطفال، أن جعل في قلوب الوالدين الرحمة والرأفة والحنان، لصالح أولادهم، وهذا عام في الكائنات ذوت الأرواح.</p><p><a href="../#s/m1755">افتح في شذرات</a></p></body></html>
