<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الخطأ سبيل إلى الصواب، والإخفاق بداية النجاح. فالصواب ابن التجربة، والنجاح وليد المحاولة. هكذا تمضي سنن الله في التطور، حيث لا يأتي الكمال من أول مرة. الكعكة الأولى محروقة، والثانية معطوبة، والثالثة غير مرضية، حتى تصل إلى الخامسة لذيذة ومطلوبة.</p><p><a href="../#s/m1950">افتح في شذرات</a></p></body></html>
