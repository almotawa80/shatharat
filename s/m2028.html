<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">المال يرفع الرؤوس، ويُبهج النفوس، ويُقرِّب العروس، ويُزيل العُبوس، وبه تُفتح لك الأبواب وعلى عتبات القصور تدوس، وفي مجالس الكبار تُقَبَّل وتبوس، وبين الولائم تحوس، لكن احذر أن يُنسيك الأصول فتكون بلا إحساس ولا خُلُقٍ ملموس.</p><p><a href="../#s/m2028">افتح في شذرات</a></p></body></html>
