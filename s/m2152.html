<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">مفهوم حرية التعبير عند الدول القوية مثل البعير، إن كان في مصلحتهم أثاروه وطبقوه، وإن كان ضد مصلحتهم عقلوه وعطلوه، القضية مصلحية وليست مبدأية، فهي تُستغل بطريقة انتقائية، بناء على المصلحة، لا المبادئ المعتبرة.</p><p><a href="../#s/m2152">افتح في شذرات</a></p></body></html>
