<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إن الله خلق الناس ليرحمهم لا ليعذبهم، وليدخلهم الجنة لا ليقذفهم في النار، وأرسل لهم رسلا يرشدونهم لطريق الجنة، ويحذرونهم من طريق النار، فمن أطاعهم دخل الجنة برحمة الله، ومن عصاهم دخل النار بسوء اختياره وطاعته للشيطان.</p><p><a href="../#s/m2281">افتح في شذرات</a></p></body></html>
