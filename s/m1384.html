<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الزوجة المثالية: هي من تجمع بين الدين، والعقل، وحسن الخلق، تحفظ زوجها في نفسها وماله، وتكون له سكنًا ورحمة، تؤازره في الشدة، وتشاركه في الرخاء، وتعينه على الطاعة، وتُدخل على قلبه السكينة والسعادة.</p><p><a href="../#s/m1384">افتح في شذرات</a></p></body></html>
