<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">دين الله يسر، إذا أتيت بالفرائض واجتنبت النواهي، فأنت حر فيما سوى ذلك من المباحات والنوافل والسنن، وكذلك أوقات الصلوات موسعة، وكذلك قضاء رمضان موسع، واجتناب الكبائر يُكفر الصغائر، وكذلك الوضوء والصلاة يكفران الصغائر، وفوق هذا وذاك رحمة الله الواسعة، ومغفرته العظيمة.</p><p><a href="../#s/m2241">افتح في شذرات</a></p></body></html>
