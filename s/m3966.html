<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">المدرس : هات جملة فيها ظرف مكان . الطالب : نام أبي البارحة تحت السرير . المدرس : هلا قلت : نام أبي البارحة فوق السرير . الطالب : لأن أُمي مدربة كاراتيه ، فهي قوية وسريعة الحركة ، فانتصرت على أبي في المعركة ، فنام تحت السرير ليحمي نفسه ، من لكمة أو رفسه</p><p><a href="../#s/m3966">افتح في شذرات</a></p></body></html>
