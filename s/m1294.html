<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">تَسْعد النفوس بالخروج إلى البرّ الواسع لأسبابٍ: سعة البر تُوسّع الصدر وتخفّف الكدر. جمال الطبيعة يُهدّئ النفس ويذهب ضغوط الحياة. البساطة والفطرة تجلب التوازن والطمأنينة. الابتعاد عن الضجيج يستدعي التأمّل والسكينة. اجتماع الأصدقاء يزيد في الأُنس والمودّة.</p><p><a href="../#s/m1294">افتح في شذرات</a></p></body></html>
