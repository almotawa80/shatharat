<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">بعض الناس يعضون اصابع الندم، ويتحسرون على ما فاتهم من الغنائم والنعم، حيث إنهم لم يشتروا العقارات والقسيمات، في زمن الرخص والتسهيلات، وكذلك الإنسان سوف يتحسر ويتذمر على ما فاته من تحصيل الحسنات قبل الفوات، وتجرع كأس الممات.</p><p><a href="../#s/m3327">افتح في شذرات</a></p></body></html>
