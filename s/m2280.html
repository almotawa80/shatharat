<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">ما هو الهُدهُد وما مرقته، وقف أمام النبي الملك سليمان عليه السلام أمام الملأ، وخاطبه بيقين وثبات: ( فقال أحطت بما لم تحط به... ) فلم يُنْكَِرْ عليه، وفي هذا تواضع نبي الله سليمان عليه السلام، ودرس بليغ وعبرة عظيمة للسلاطين والملوك والأمراء</p><p><a href="../#s/m2280">افتح في شذرات</a></p></body></html>
