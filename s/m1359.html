<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا تُصغِ لكل مُرجف، ولا تقبل كل شائعة، فالأراجيف كثيرة، فلا تأخذ إلا ما جاءك من جهةٍ موثوقة مسؤولة، وإذا أتاك اليقين فعض عليه بالنواجذ، ودع عنك قول المُهوّلين والمشعوذين.</p><p><a href="../#s/m1359">افتح في شذرات</a></p></body></html>
