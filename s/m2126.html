<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">كونوا كنبيكم عليه الصلاة والسلام لقومه، عندما قال لهم: إذهبوا فأنتم الطلقاء، ولا تكونوا كقومه له. كونوا كيوسف عليه السلام لأخوته، ولا تكونوا كأُخوة يوسف لأخيهم.</p><p><a href="../#s/m2126">افتح في شذرات</a></p></body></html>
