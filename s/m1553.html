<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">زوج ابنتك صهرك، وهو ستر وغطاء لابنتك، فأكرمه واحترمه، ليحفظ لك ذلك في إكرام ابنتك، ولا تُخاشنه أو تحتقره فينعكس وبال ذلك على ابنتك، فِلْذَةُ كَبِدِك.</p><p><a href="../#s/m1553">افتح في شذرات</a></p></body></html>
