<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إن عزمت على الزواج، فالتمس الخُلق والأدب والدين. وإن هممت بالبناء، فالتمس المقاول الأمين الناصح المنجز بشهادة من بنى لهم من العالمين. وأما دينه وعمله وتصرفاته فحسابها عليه، لا عليك. فخذ منه ما صفا لمقاصدك، ودع له ما كدر لنفسه لا لك.</p><p><a href="../#s/m1445">افتح في شذرات</a></p></body></html>
