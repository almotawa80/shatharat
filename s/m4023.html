<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الطفل الصغير لا يُحسن الوقوف والمشي ، فما يزال يحاول ويحاول بلا ملل ولا كلل حتى يحسن المشي ثم يحسن مهارات المشي ، ثم يصبح المشي لديه عادة وملكة ، فحاول أيها الكبير أن تتعلم ما لا تحسنه بمثابرة وإصرار حتى تتعلمه ثم تكتسب مهاراته ثم يصبح عادة وملكة.</p><p><a href="../#s/m4023">افتح في شذرات</a></p></body></html>
