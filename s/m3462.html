<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لو كان بالإمكان جمع دول الخليج ثم العرب ثم المسلمين؛ على قلب رجل واحد، وكلمة واحدة؛ لتغيرت أحوال العالم إلى الأفضل والأحسن؛ لأن المسلمين هم حراس الفضيلة وأعداء الرذيلة، ومعهم الحق وصواب البيان، والتوحيد والإيمان.</p><p><a href="../#s/m3462">افتح في شذرات</a></p></body></html>
