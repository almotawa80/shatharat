<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">عندما تُروض الحصان، تتعامل معه باللطف واللين، فإذا استجاب لك تُكافئه بجزرة أو سكرة، وإن لم يستجب ترفع السوط، أو تضربه ضربة خفية ناعمة. ومن باب أولى وأجدر أن تتعامل مع الإنسان، باللطف واللين، وإن خاشنك فلا تخاشنه، بل ادفع بالتي هي أحسن، فيصبح العدو صديقا، والنافر أليفا، والخشن لطيفا.</p><p><a href="../#s/m1654">افتح في شذرات</a></p></body></html>
