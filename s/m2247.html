<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الإنسان يستعين بالله أولا، ثم يستعين بالناس، ويشكر الله أولا ثم يشكر الناس، هذا هو الصواب، أن تجمع بين التوكل على الله أولا، ثم تأخذ بالأسباب، فتجمع بين عمل القلب من ناحية، وعمل العقل والجوارح من ناحية ثانية.</p><p><a href="../#s/m2247">افتح في شذرات</a></p></body></html>
