<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">النقد مطلب كل فرد في الهزل والجد، ومن لا يملك النقد دمعته تسيل عل الخد، ويرى الأبواب مغلقة والطرق فيها شوك وسد. ومن يمتلك النقد، وأمواله لا تُعد، يرفع الهامة وصوته يمتد، وأقواله أفعال تُنفذ فورا قبل الغد، والأبواب في وجهه مفتوحة ليس دونها رَدّ ولا صدّ ولا سدّ.</p><p><a href="../#s/m2375">افتح في شذرات</a></p></body></html>
