<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الوتساب ليس قناة إخبارية، أو محطة رياضية، أو نشرة صحية، أوجامعة علمية، فالتكرار غالبا يُولد الملل والنَّفَار، الوتساب سوق أو مجمع تجاري أو جمعية، فيه العطور والذهب، وفيه الفحم والحطب، وفيه الخوخ والرمان وفبه البصل والباذنجان، فالوتساب لجميع الآراء والأحباب، باللين والحب والآداب.</p><p><a href="../#s/m1256">افتح في شذرات</a></p></body></html>
