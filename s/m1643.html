<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من رحمة الله وعدله أنه لا يُؤاخذ العبد على مشاعره التي لا يملك دفعها، فلا عذاب بدمع العين ولا بحزن القلب، بل الحساب على ما ينطق به اللسان ويستقر في الجَنان، فالكلمات مَوزونة، والنيات مَحسوبة، والعبد بين رحمة الله أو عقابه، بحسب اختياراته وترجيحاته.</p><p><a href="../#s/m1643">افتح في شذرات</a></p></body></html>
