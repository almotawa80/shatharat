<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">كثرة الخلافات والنزاعات الداخلية تُطمع الأعداء المتربصين في الخارج، فَصَفُّوا النفوس، ورصوا الصفوف، ووحدوا الصف والكلمة، واتفقوا ولا تختلفوا، واجتمعوا ولا تتفرقوا، فيد الله فوق يد الجماعة، والجماعة قوة وشجاعة ومناعة.</p><p><a href="../#s/m3291">افتح في شذرات</a></p></body></html>
