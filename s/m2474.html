<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أكرموا غوغاءكم، فإنهم يُنقذون الغريق، ويرصفون الطريق، ويُطفئون الحريق، ويسدون البثوق، ويحفرون الآبار، ويحملون الأحجار، ويبنون الدار. إن اجتمعوا ضروا وإن تفرقوا نفعوا، كل يذهب لحرفته وصنعته ومهنته وعمله، أكرموهم واحذروهم فإنهم يسيرون خلف كل ناعق، فأكرموهم ولا تسيروا خلفهم.</p><p><a href="../#s/m2474">افتح في شذرات</a></p></body></html>
