<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إن الله جلت حكمتُه وعظمت قدرتُه وعمت رحمتُه، خلق الملائكة لا يعصون، وخلق الشياطين لا يطيعون، وخلق الإنس يطيعون ويعصون، فيستغفرون فيغفر الله لهم، فرحمتُه غلبت غضبَه، وعفوُه غلب عقابَه.</p><p><a href="../#s/m2231">افتح في شذرات</a></p></body></html>
