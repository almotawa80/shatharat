<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من أعظم نِعَمِ الله على عبده بعد نعمة الهداية، نعمة الخلق والحياة ونعمة الصحة، ونعمة الجوارح والحواس، فلا يجوز شرعا ولا عقلا ولا فطرة، التفريط بها، والتهور في تعريضها للفناء والخراب والدمار، عن طريق مزاولة اللعب والأنشطة التي فيها خطورة كارثية عظيمة عليها.</p><p><a href="../#s/m2225">افتح في شذرات</a></p></body></html>
