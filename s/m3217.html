<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الاستعانة بالآلات من خصائص الإنسان فالحقل الذي يحتاج مائة عامل،مع التقدم العلمي أصبح يحتاج إلى عشرة فقط فبرزت مشكلة الأيدي العاملة فبعض الأحيان التقدم العلمي يحل مشكلة ثم ينشأ من حل المشكلة؛ مشكلة جديدة تحتاج إلى حل.</p><p><a href="../#s/m3217">افتح في شذرات</a></p></body></html>
