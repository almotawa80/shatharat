<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">القرآنُ نزلَ في الحجاز، وقُرئ في مِصرَ بالتجويد والإعجاز، وحُمِل في الصدور، وسار في الأمصار، وطُبِّق في القرون الأولى، بلا تقصيرٍ ولا انحياز، فصار هدايةً لكل العصور، يُبدد الظلام وينشر النور.</p><p><a href="../#s/m1263">افتح في شذرات</a></p></body></html>
