<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إذا رأيتم الرجل يصل رحمه، ويُحسن إليهم ويبرهم، ويبذل لهم نداه، يكف عنهم أذاه، فتوقعوا له أن الله سوف يبسط له في رزقه، ويمد له في أجله.</p><p><a href="../#s/m3296">افتح في شذرات</a></p></body></html>
