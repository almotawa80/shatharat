<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">يابن آدم لا تُعاهد الله أبدا، ولا تطلب من أحد أن يُعاهد الله، فإن اُضطُررت فعاهد غير الله، فلأن تغدر بعهد غير الله، خير لك من أن تغدر بعهد الله، لأن ابن آدم متقلب الأطوار، في الليل والنهار، ولا يثبت على حال.</p><p><a href="../#s/m1740">افتح في شذرات</a></p></body></html>
