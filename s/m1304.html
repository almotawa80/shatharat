<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">عند طلب الحقوق، ابدأ باللين والرجاء، واطرق الباب بالأدب والحياء، فإن لم يُفتح، فأَعِد الطرق بالإلحاح والمساءلة، فإن أُغلق في وجهك، فاصدع بالمحاججة، واطلبه بالضجيج والجعجعة، فبعض الحقوق لا تُهدى، بل تُنتزع بالمخاشنة بعد المحاولة والملاينة.</p><p><a href="../#s/m1304">افتح في شذرات</a></p></body></html>
