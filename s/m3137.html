<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إن أردت أن تعرف قيمة الوقت فَزُرْ المقابر. إن أردت أن تعرف قيمة الصحة فَعُدْ المرضى. إن أردت أن تعرف قيمة الحرية فَزُرْ السجناء. إن أردت أن تعرف قيمة البصر فَزُرْ معهد النور. إن أردت أن تعرف قيمة الأسرة فَزُرْ مأوى الأيتام ( اللقطاء ) وهلم جرا.</p><p><a href="../#s/m3137">افتح في شذرات</a></p></body></html>
