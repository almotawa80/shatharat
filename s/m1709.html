<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الرجل يقوم بأعمال شاقة: كالحفر والبناء وحمل الحجارة وغير ذلك، من أجل أن يوفر لأهل بيته: الضروريات والحاجيات وبعض الكماليات، ويضمن لهم حياة كريمة وسعيدة، فهو يشعر بسعادة غامرة، عندما يسعد أولاده وأهل ببته.</p><p><a href="../#s/m1709">افتح في شذرات</a></p></body></html>
