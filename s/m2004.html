<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">العدل ميزان الحياة، به تُؤدى الحقوق، وتُرد المظالم، وتطمئن النفوس. والوفاء بالعهد شرف الأخلاق، وسرُّ الثقة بين الناس، به تُحفظ المواثيق، وتدوم العلاقات على أسس راسخة.</p><p><a href="../#s/m2004">افتح في شذرات</a></p></body></html>
