<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إن صادفت شابا أحمق، أو رجلا سفيها، أو مراهقا طائشا، وبيده شفرة حادة، أو سكينة طريرة، فلا تجادله، ولا تضيق عليه في الحوار، فخذ حذرك منه، وهاوده ولاينه وياسره، حتى تسلم من شره وسوء تصرفه، وبذاءة لسانه، فالكلب العقور إذا حُوصر عقر.</p><p><a href="../#s/m2289">افتح في شذرات</a></p></body></html>
