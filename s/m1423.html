<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الوقت نفحة من العمر، والعمر أنفسُ من أن يُهدر، فلا تُبدّد دقائقك في همٍّ مقيم، أو حزنٍ عقيم، ولا في سفاسف الأقوال والأفعال، فما مضى منه لا يُشترى، وما بقي رأسُ مال، لا يُقدر بأثمان، واستعن بالله الرحيم الرحمن.</p><p><a href="../#s/m1423">افتح في شذرات</a></p></body></html>
