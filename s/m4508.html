<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">في ميدان التبرعات، اتبعوا هذه القواعد: 1. ابدأوا بالتأكد من مصداقية الجهات المستقبلة للتبرعات. 2. ثم وجهوا دعمكم للأكثر احتياجًا. 3. وأخيرًا، استفيدوا من العروض والتخفيضات لزيادة أثر تبرعاتكم.</p><p><a href="../#s/m4508">افتح في شذرات</a></p></body></html>
