<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">العالِم يُقدّم الفتوى للعامة مختصرة، ليسهل عليهم فهمها وحفظها، ولو دخل معهم في التفاصيل لأربكهم. أما إذا كان السائل طالبَ علم، أفاض له في الأدلة وأصول المسألة، ليبني فهمًا راسخًا مبنيًا على الدليل والبرهان.</p><p><a href="../#s/m1897">افتح في شذرات</a></p></body></html>
