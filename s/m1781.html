<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">سبحان الله! الرجل يلعن أخاه المسلم، فإذا سألته: متى عهدك بلعن فرعون وقارون؟ قال: ها ها لا أدري! لا أذكر أني لعنتهما، قال: سبحان الله يسلم منك عرض عدوك الكافر، ولا يسلم منك عرض أخيك المسلم!</p><p><a href="../#s/m1781">افتح في شذرات</a></p></body></html>
