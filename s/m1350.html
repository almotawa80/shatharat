<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أثر الأذان في النفس والناس الأذانُ يُحيي القلوب بعد غفلة، ويُطمئن الأرواح بعد وحشة، ويبعث في النفس الطمأنينة، ويجعل للوقت بركة وسكينة. هو نداءُ التوحيد والوحدة، وسِرُّ الاجتماع والألفة، به تجتمع الأمة، وتتوحد الكلمة، وتعمّ البركة والرحمة.</p><p><a href="../#s/m1350">افتح في شذرات</a></p></body></html>
