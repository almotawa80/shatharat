<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إن أطلقْتَ لسانَك بغير حقّ، كَثُر عليك الخصام، وزاد عليك الملام، وسَخِطَ عليك الملكُ العلّام، واضطرب قلبُك وقلَّ الأمان، أمّا إن نطقتَ بالحقّ ابتغاءَ وجهِ الرَّحمن، فلك الثواب والأمان، من الكريم المنان، وأثنى عليك الأنام.</p><p><a href="../#s/m1493">افتح في شذرات</a></p></body></html>
