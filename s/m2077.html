<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الوتساب ينقل الزهرة، والبعرة والتمرة والجمرة، والذهب والحطب، والخيار والصَّبَّار، فلا تُبادروا بالنشر والتصديق إلا بعد التحقيق والتدقيق، حتى لا تقعوا في القدح والتقريع.</p><p><a href="../#s/m2077">افتح في شذرات</a></p></body></html>
