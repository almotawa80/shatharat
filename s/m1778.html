<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من آمارات الضعيف الذي لا ينوى الرد أن يقول: نُحمل الفاعل المسؤولية، ونرد عليه في الوقت المناسب والظرف المناسب والمكان المناسب، هذا رد الضعيف، لحفظ ماء الوجه، ومسح عرق الجبين. أما القوي فيكتم ويستعد ويُنيم العدو، ثم يباغته بضربة مفاجئة مُربكة حاسمة.</p><p><a href="../#s/m1778">افتح في شذرات</a></p></body></html>
