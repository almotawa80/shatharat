<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">بشروا ولا تنفروا ، يسروا ولا تعسروا ، تآلفوا ولا تنافروا ، اجتمعوا ولا تتفرقوا ، واعلموا أن الإسلام ليس مثل حدِّ السيف ، ولا يأمرك أن تشق الشعرة طولا شعرتين ، ولا أن تعقد بين شعيرتين ، وإنما فيه تيسير ورخص ، ويحث على اختيار الأيسر ، ومن فقه الرجل أن يفتي بالبسير لا بالعسير.</p><p><a href="../#s/m2724">افتح في شذرات</a></p></body></html>
