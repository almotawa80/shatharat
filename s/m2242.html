<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">المال إن كسبته بالمباحات، وأنفقته في الطاعات، فهو يُحقق لك السعادة المادية والمعنوية في الحياة، وبعد الممات، والمال عديل الروح، وشقيق النفس، وصنو الحياة، والمال دعوة مستجابة، به تُوصل الأرحام، ويُنعش الفقير والمسكين والأيتام، ويُكسى العاري ويُطعم الجَوعان، ومن قُتل دون ماله فهو شهيد.</p><p><a href="../#s/m2242">افتح في شذرات</a></p></body></html>
