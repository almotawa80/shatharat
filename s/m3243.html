<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">العالم آلة كبيرة ، فكن تُرْسا نافعا في أُسرتك ، وأُسرتك تُرْسا نافعا في عائلتك ، وعائلتك تُرْسا نافعا في قبيلتك ، وقبيلتك تُرْسا نافعا في شعبك ، وشعبك تُرْسا نافعا في اقليمك ، واقليمك تُرْسا نافعا في العالم.</p><p><a href="../#s/m3243">افتح في شذرات</a></p></body></html>
