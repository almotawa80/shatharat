<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">استقوا من المنابع الصافية، وإياكم والمنابع الكدرة. فعلم الحلال والحرام والأحكام يُؤخذ عن العلماء الأتقياء المشهود لهم بالصلاح والورع. أما الوعظ والإرشاد والترغيب في فضائل الأعمال، والترهيب من رذائلها، وعلم التاريخ والسِّير فيؤخذ عن المشايخ وطلبة العلم.</p><p><a href="../#s/m2164">افتح في شذرات</a></p></body></html>
