<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الصانع أعلم بصنعته، والزارع أعلم بزرعه، وهَلُمَّ جراً، والخالق أعلم بخلقه، فأفضل رياضة المشي إلى المساجد، وحركات الصلاة، وأفضل نظام غدائي للصحة والتخسيس الصيام وتقليل الطعام.</p><p><a href="../#s/m2187">افتح في شذرات</a></p></body></html>
