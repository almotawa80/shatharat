<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من تعلم القرآن عظمت قيمته، ومن تكلم في الفقه نبل قدره، ومن كتب الحديث قويت حجته، ومن نظر في اللغة رقّ طبعه، ومن نظر في الحساب جزل رأيه، ومن لم يصن نفسه لم ينفعه علمه.</p><p><a href="../#s/m4597">افتح في شذرات</a></p></body></html>
