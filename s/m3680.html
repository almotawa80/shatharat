<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من تزوج امرأةعندها طفل فقد تزوج نصف امرأة ومن تزوج امرأة عندها طفلان فقد تزوج ثلث امرأة، ومن تزوجت رجلا متزوجا فقد تزوجت نصف رجل ومن تزوجت رجلا متزوج زوجتين فقد تزوجت ثلث رجل</p><p><a href="../#s/m3680">افتح في شذرات</a></p></body></html>
