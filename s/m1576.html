<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الموت خاتمة دارٍ فانية، دارِ ابتلاءٍ وامتحان، ينجو فيها من آمن وعمل صالحًا، ويهلك فيها من كفر وأعرض. وهي في الوقت نفسه فاتحة دارٍ باقية، دارِ جزاءٍ وعدل وفضل، يُكرم الله فيها المتقين بالجنة والرضوان، ويُذلّ فيها الجاحدين بالهوان والخزي والنيران.</p><p><a href="../#s/m1576">افتح في شذرات</a></p></body></html>
