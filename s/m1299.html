<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من خالفَ السُّننَ الكونيّة، والقواعدَ الصحيّةَ البدنيّة، وأراد أن يُنقِصَ وزنَه بسرعة؛ فقد أخطأ الطريق، وخالف الحكمة. فما بناهُ الجسدُ على مَهَلٍ، لا يُهدمُ في عَجَل، وما تراكمَ في سنين، لا يزولُ في أسابيع. ومن طلبَ النتائجَ بلا مُقدِّمات، حصدَ العواقبَ بلا سلامة.</p><p><a href="../#s/m1299">افتح في شذرات</a></p></body></html>
