<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">قال لي طالب علم : لا تقل : جعله الله في ميزانك ، ولكن قل : جعله الله في ميزان حسناتك ، فقلت له ( فأما من ثقلت موازينه فهو في عيشة راضية ) ولم يقل : موازين حسناته</p><p><a href="../#s/m3349">افتح في شذرات</a></p></body></html>
