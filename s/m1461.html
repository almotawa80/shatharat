<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الهداياُ الغاليةُ تفتحُ الأبوابَ الموصدة، وتقرِّبُ القلوبَ النائيةَ، وتُلَيِّنُ النفوسَ النافرة، وتُحيي الودَّ، وتزرعُ البسمةَ، فهي مفاتيحُ القلوب، ورسائلُ حبٍّ بلا حروف، تُحَسِّنُ الظنَّ، وتزيل الصدود.</p><p><a href="../#s/m1461">افتح في شذرات</a></p></body></html>
