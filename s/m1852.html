<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">كونك على الحق لا يمنحك مبررًا لمخاشنة أخيك الذي ضلّ الطريق. بل كن معه كما يكون الطبيب مع المريض، ولا تُغلق الأبواب المفتوحة بينكما. فدعوة الأخلاق أبلغ وأعمق تأثيرًا من دعوة الأقوال، وهي التي تُمهد الطريق لقبول الأقوال. والشيطان يسعى دائماً إلى إثارة الفتنة بينكم، فلا تنساق وراءه.</p><p><a href="../#s/m1852">افتح في شذرات</a></p></body></html>
