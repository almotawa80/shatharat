<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من ظلمك أو أساء إليك كمن كتب لك حوالة لتأخذ من رصيد حسناته، يوم القيامة بقدر مظلمته، أحوج ما تكون إليها، إن أنت كظمت غيظك، ولم تقتص منه في الدنيا، وعفوت عنه فأجرك على الله الكريم، فطوبى للكاظمين الغيظ والعافين عن الناس، والله يحب المحسنين.</p><p><a href="../#s/m2292">افتح في شذرات</a></p></body></html>
