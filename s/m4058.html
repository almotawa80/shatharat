<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">قالوا لهمام : لماذا لا تتزوج ؟ قال : أنا ضد الزواج . قالوا : قد بلغت الأربعين . قال : لأني في الحالتين أنا خسران . قالوا له : كيف ذلك ؟ قال : إذا قسوت على زوجتي قالوا : ذيب ، وإذا صرت حبوبا قالوا : خروف . ففي كلا الحالتين أنا حيوان</p><p><a href="../#s/m4058">افتح في شذرات</a></p></body></html>
