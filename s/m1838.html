<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من المهم جدا أن يكون تفسير القرآن مبنياً على العلم والمنهجية الصحيحة، ولذلك يجب على من يريد التفسير أو الاستشهاد بآية، فعليه أن يعود إلى كتب التفسير المعتمدة مثل تفسير ابن كثير، الطبري، القرطبي وغيرهم من العلماء المشهود لهم بالدقة والعلم، وإلا كان كحاطب ليل، أو كمجروف سيل.</p><p><a href="../#s/m1838">افتح في شذرات</a></p></body></html>
