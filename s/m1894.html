<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لتكون الدولة قوية وتحمي نفسها، يجب أن ترتكز على ثلاث دعائم متينة، بعد الإيمان بالله تعالى والتوكل عليه: 1. اقتصاد قوي: يعزز الاكتفاء الذاتي. 2. جيش متطور: بتكنولوجيا حديثة. 3. وحدة وطنية: تعزز التعاضد والتماسك.</p><p><a href="../#s/m1894">افتح في شذرات</a></p></body></html>
