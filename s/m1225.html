<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">احترموا كبيركم، واعطفوا على صغيركم، ووقروا عالمكم، وأطيعوا أميركم، وأنعشوا فقيركم، وأشفقوا على يتيمكم، وصِلوا أرحامكم، ولا تحتقروا غريبكم وضعيفكم، وحافظوا على أخلاق دينكم، تكسبوا رضا ربكم، ومحبة الناس وأهلكم.</p><p><a href="../#s/m1225">افتح في شذرات</a></p></body></html>
