<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">ما هي المعاملة الأمثل مع زوجك: أطيعيه في غير معصية. أكرميه قولًا وفعلًا. حافظي على بيته وماله وسِرِّه. قابليه باللين لا بالجفاء. اجعلي احترامك له طبعًا لا تكلُّفًا. امنحيه الحب والطاعة. تكثري العتاب والشكوى. لا ترفعي صوتك فوق صوته.</p><p><a href="../#s/m4514">افتح في شذرات</a></p></body></html>
