<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من يذنب ويشعر بالندم، خير ممن يذنب ولا يشعر بالندم ومن يذنب ولا يشعر بالندم، خير ممن يذنب ويتباهى بالذنب. فالأول يرجى له والثاني يرجى له ويخشى عليه، والثالث يخشى عليه.</p><p><a href="../#s/m837">افتح في شذرات</a></p></body></html>
