<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">اطلبوا العلم من المهد إلى اللّّحد، ومن المَحْبَرة إلى المقبرة، ومن الطفولة إلى الكهولة، ومن نزغة الشباب إلى رزانة الشياب، فالعلم نور والجهل ظلمات، وفضل العالم على العابد كفضل القمر على الكواكب، العالم في قومه كالنبي في أُمته، وكالبصير في العميان، والسراج المنير في الظلام المستطير.</p><p><a href="../#s/m1854">افتح في شذرات</a></p></body></html>
