<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الحمد لله الذي فضلنا بنعمٍ جعلت غيرنا يسعى إلينا طلبًا للعمل وخدمتنا، بينما لا نحتاج إلى السعي لخدمتهم. وهذه نعمة منسية، تستوجب شكر الله بالقول والعمل والنية، مع تقوى الله في معاملتهم بالإحسان بعيدًا عن التكبر والتضييق، والفوقية.</p><p><a href="../#s/m1940">افتح في شذرات</a></p></body></html>
