<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الحكيم مثل الطِّيب إن أثرته عبقت منه روائح طيبة أفنان وألوان، وذاع شذاه في الآفاق والأركان، وتكلم بالحكمة ونطق بفصيح البيان، ونبه العقول وشنف الآذان، وحرك الجَنان، بالمحبة والخوف من الرحمن.</p><p><a href="../#s/m2296">افتح في شذرات</a></p></body></html>
