<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">تقوية الإيمان: أن تجالس وتصاحب من هم أقوى منك إيمانا، وأكثر منك خشوعا، وأوسع منك علما وفقها. فالصاحب ساحب، والرفيق من يسايرك في طريق الحياة، بالرفق والنصح والتوفيق، والمرء يُحشر مع خليله، فلينظر أحدكم من يُخالل.</p><p><a href="../#s/m1351">افتح في شذرات</a></p></body></html>
