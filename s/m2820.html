<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إذا كنت منفعلا وفي حماس شديد ، فلا تكثر الكلام ، لأن اللسان سوف يسبق العقل ، فيتكلم بكلام يُوجب عليك الندم ، وذل الاعتذار ، والتنصل من القصد المباشر ، وإن كان مع الزوجة فيلزمك هدية سمينة ثمينة ، أو ساعة أو عقد ذهب من الصاغة ، وإلا فسوف تنام في الصالة.</p><p><a href="../#s/m2820">افتح في شذرات</a></p></body></html>
