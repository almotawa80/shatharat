<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">‏التدقيقُ في كلِّ صغيرةٍ وكبيرة، والمحاسبةُ على النقيرِ والقطمير، والمقاصّةُ في كلِّ موقفٍ وكلمة، تُفسدُ صفوَ العِشرة، وتُبدِّدُ وُدَّ الأزواجِ والأصحاب. فالسكوتُ أحمدُ عاقبة، والتغافُلُ عقلُ الحكماءِ، يُطفِئُ نارَ الشرِّ، ويُبقي على نورِ المودَّة.</p><p><a href="../#s/m1199">افتح في شذرات</a></p></body></html>
