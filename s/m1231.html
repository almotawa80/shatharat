<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">وطنوا أنفسكم على أن تتحملوا من الناس: الجحود والصدود والسدود والبرود، فلا تغيروا عاداتكم الجميلة لتصرفاتهم القبيحة، فلنجعل الفضيلة تنتصر على الرذيلة، والأخلاق الحميدة تدحر الأخلاق القبيحة، فتجملوا بالأخلاق والآداب، قبل أن تتجملوا بالزينة وفاخر الثياب.</p><p><a href="../#s/m1231">افتح في شذرات</a></p></body></html>
