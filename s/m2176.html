<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الضعيف الذي لا ينوي الرد يكتفي بقول: &quot;نُحمل الفاعل المسؤولية، وسنرد في الوقت والمكان المناسبين.&quot; هذا كلام لتبرير العجز وحفظ ماء الوجه. أما القوي، فيكتم ويستعد، ثم يباغت خصمه بضربة حاسمة ومفاجئة.</p><p><a href="../#s/m2176">افتح في شذرات</a></p></body></html>
