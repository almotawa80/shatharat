<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">سألوا متشائما : لماذا تأخرت عن الزواج ؟ قال : أنا لا أنصح بالزواج ! قالوا له: لماذا لا تنصح بالزواج . قال : إذا صرت قويا على زوجتي ، قالوا : ذيب . وإذا صرت ضعيفا قالوا : خروف . فأنا في كلا الحالتين أصير حيوانا !!</p><p><a href="../#s/m4119">افتح في شذرات</a></p></body></html>
