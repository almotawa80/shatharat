<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا شك ولا ريب أن الهداية والتوفيق للصراط المستقيم، تفضل من الله العظيم، ولكن على العبد أن يسأل الله الهداية، ويستعيذ به من الغواية، ويلازم الصالحين، ويهجر الطالحين، ويستعين على ذلك بكثرة الذكر والاستغفار، والله يقول: فاستهدوني أهدكم، فعلى العبد أن يسعى ويطلب الهداية.</p><p><a href="../#s/m2222">افتح في شذرات</a></p></body></html>
