<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إنَّ اللهَ امتنَّ على الإنسان بنعمةِ العقل، وأعضاءٍ متينة، ومفاصلَ مرنة، بها يُحسن التصرّف ويتكيَّف مع المستجدات، فيسعى لجلب المنافع والمصالح، ويجتهد في دفع المضار والمفاسد. فسبحان الله المُنعم المُتفضل على جميع مخلوقاته، بجليل النِّعم، وعظيم المِنَنِ</p><p><a href="../#s/m1481">افتح في شذرات</a></p></body></html>
