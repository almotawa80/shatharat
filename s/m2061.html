<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">تعلمت في بيتي الكلام، وتعلمت في مدرستي النقاش، وتعلمت في مجتمعي الجدال، ثم وجدت الصمت رخيصا فاشتريته، ثم شرعت أقرأ كتب الحكماء والأدباء والعلماء، فاصبحت حكيما، فالعلم بالتعلم، والجهل بالعزلة والإنطواء، وعدم مجالسة العلماء والحكماء والمجربين والأدباء.</p><p><a href="../#s/m2061">افتح في شذرات</a></p></body></html>
