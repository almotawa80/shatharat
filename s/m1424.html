<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">رجلٌ افتتح مطعمًا يلقى رواجًا وإقبالًا، فقال له صديقٌ له: إن عمّالك يسرقونك. فقال: أعلم. قال: فلِمَ لا تستبدلهم؟ قال: أولًا، هم يُرَبِّحونني رغم ما يأخذون، وثانيًا، لا أضمن أن من يأتي بعدهم يكون أصلح منهم، فدعك من هذه المغامرة الفاشلة.</p><p><a href="../#s/m1424">افتح في شذرات</a></p></body></html>
