<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الحريةُ الشخصيةُ أن تختار قهوتك أو شايك، مُحلىً أو مُرًّا، ساخنًا أو فاتِرًا، أمّا فرائضُ الدين وثوابتُ اليقين، فامضِ فيها مستقيمًا كما أُمرت، لا ميلَ فيها ولا تبديل لهوى ولا شَطَط ولا تعليل.</p><p><a href="../#s/m1398">افتح في شذرات</a></p></body></html>
