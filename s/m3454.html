<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">بعض الكلمات مثل بُنيات النخلة، وبعض الكلمات مثل شوك النخلة، فالأولى تمنح الغذاء والحلواء، والثانية تُثير الألم وتُسيل الدماء، فتوخى الكلمات العذبة المهذبة المذهبة، وتجافى عن الكلمات النابية المنافية الجافية.</p><p><a href="../#s/m3454">افتح في شذرات</a></p></body></html>
