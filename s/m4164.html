<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">السنة وعاء زمني مقدر ، وهو مرحلة عمرية ، وقابل لأن تملأه بالخير والمعروف والنشاط والعمل الصالح ، لنفسك وأهلك ووطنك وأُمتك والعالم أجمع ، وقابل لضد ذلك ، فاحرص واجتهد على أن تملأه بما ينفعك في دينك ودنياك،مستعينا بربك ومولاك ، واجعل شعارك : (خير الناس أنفعهم للناس)</p><p><a href="../#s/m4164">افتح في شذرات</a></p></body></html>
