<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الزوجة وعموما المرأة، متقلبة الأطوار، وسريعة في اتخاذ القرار، ولا تقدر على حفظ الأسرار. فالنصيحة: خالطها بالحلم، ودارها بالحكمة، وأحطها بالمودة، فإن صبرك عليها دواء، وحلمك شفاء، ورفقك بها بقاء.</p><p><a href="../#s/m1509">افتح في شذرات</a></p></body></html>
