<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الرجل يستطيع أن يرى نجوم السماء الغابرة في الأُفق، ولا يستطيع أن يرى ما تُقدمه له زوجته من الأعمال الجليلة: مشقة الحمل ومعاناة الولادة، ومكابدة الرضاعة وتعب تربية الأولاد وغيرها كثير.</p><p><a href="../#s/m3733">افتح في شذرات</a></p></body></html>
