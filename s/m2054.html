<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الزواج لا يُبنى على الحُبِّ وحده، بل يُبنى على الحُبِّ ومكارم الأخلاق وشرف الأعراق، فإذا خمدت جَذوة الحُبِّ تبقي مكارم الأخلاق، وشرف الأعراق، فهذا ضمان لبقاء الحياة الزوجية السعيدة الهنية.</p><p><a href="../#s/m2054">افتح في شذرات</a></p></body></html>
