<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">العمل يحتاج إلى الإرادة، والإرادة تحتاج إلى العلم، والعلم يحتاج إلى العقل، والعقل يحتاج إلى التجارب، والتجارب لا تتم إلا بمزاولة العمل، إذا العمل يحتاج إلى العمل.</p><p><a href="../#s/m71">افتح في شذرات</a></p></body></html>
