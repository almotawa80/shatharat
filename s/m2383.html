<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا تبحثوا عن الشخص الذي عنده خير وليس فيه خير، ولا تبحثوا عن الذي فيه خير وليس عنده خير، ولكن ابحثوا عن الذي عنده خير وفيه خير. أما الذي فيه خير وما عنده خير يكفي أن تلقاه بالصدفة من غير بحث عنه.</p><p><a href="../#s/m2383">افتح في شذرات</a></p></body></html>
