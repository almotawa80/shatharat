<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">ليس كل خطيبٍ مِصْقَع، ولا داعيةٍ بليغ، ولا واعظٍ مؤثر، ولا مثقف فصيح، ولا مفكرٍ إسلامي مُلهم، أهلًا أن يتصدر للفتوى الشرعية؛ فإن لكل علمٍ رجاله، ولكل فنٍ أهله، ولكل مقامٍ مقال، واحترام التخصص واجب عقلي وعلمي واجتماعي، فالعلم تخصص عمودي عميق، والثقافة تخصص أُفقي شامل.</p><p><a href="../#s/m1435">افتح في شذرات</a></p></body></html>
