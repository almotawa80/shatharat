<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الأصل أن الخوف إيجابي ، لأنه يحمل الإنسان على الحذر ، وتوقي الخطر. أما إذا كان مبالغا فيه ، فيصبح سلبيا ، ومعوقا عن العمل ، ومحبطا للأمل ، ومثبطا عن النشاط ، وداعيا للتوتر والانحطاط.</p><p><a href="../#s/m3161">افتح في شذرات</a></p></body></html>
