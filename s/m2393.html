<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">يجب على الحكومة أن تُوجد فرص عمل لأفراد شعبها، فيها منافع للبلد والمجتمع، برواتب تغطي الضروريات والحاجيات، حتى يعيشوا بكرامة، وحتي يستتب الأمن، وتقل معدلات الجريمة، ومنها: السرقة والغش والرشوة والاختلاس.</p><p><a href="../#s/m2393">افتح في شذرات</a></p></body></html>
