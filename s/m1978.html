<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">التغيرات التي تطرأ على ظاهر الإنسان وباطنه مع مرور العمر هي جزء من سنن الحياة الدنيا، حيث يترك الزمن أثره على الجسد والعقل. أما في الجنة، فلا يطرأ تغير ولا يعكر صفو النعيم، إذ يبقى الإنسان في أكمل صورة وأفضل حال، مما يجسد كمال النعيم ودوام الوعد الإلهي للمؤمنين.</p><p><a href="../#s/m1978">افتح في شذرات</a></p></body></html>
