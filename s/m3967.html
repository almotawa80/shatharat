<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الديمقراطية نظام سياسي غير ناجح ؛ لأنها مبنية على الكم لا الكيف ، والقيادة في أي مجال تحتاج إلى من هو متميز بعلمه وتفكيره وأخلاقه ، فهو يحافط على مكانته وسمعته وسمعة عائلته ، فيتنزه عن كل ما يجرح نزاهته وأمانته ، فشروط القيادة مبنية على الكيف لا الكم.</p><p><a href="../#s/m3967">افتح في شذرات</a></p></body></html>
