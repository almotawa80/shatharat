<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">التعاليم السماوية منسجمةٌ مع الفطرة الإنسانية، لاتحاد المصدر الإلهي، وسلامة النهج من الزلل والقصور. فإذا جرى تطبيق التعاليم السماوية في الأفراد والمجتمعات، استقام الميزان واعتدل البنيان. والأب مسؤولٌ عن إقامتها في أهل بيته، كما أن وليَّ الأمر مؤتمنٌ على تطبيقها في رعيته.</p><p><a href="../#s/m1592">افتح في شذرات</a></p></body></html>
