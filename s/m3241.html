<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">مشاعر المرأة أكثر رقة وعاطفة من الرجل في مسائل الحب والعاطفة ، فغالبا تتجنب أن تمدح رجلا في حضرته ، حتى لا تستثير زعله وغضبه ، إذا علمت من طبعه أنه يغار عليها كثيرا ، وهذا شيء يُعجبها ويُسعدها ، أعني أنه يغار عليها ، فهذه أمارة الحب والإعجاب.</p><p><a href="../#s/m3241">افتح في شذرات</a></p></body></html>
