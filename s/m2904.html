<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الأسنان عنوان الشباب لأن الشباب قوة ونشاط ، والقوة تحتاج إلى طاقة ، والطاقة تحتاج إلى الأكل ، والأكل يحتاج إلى الأسنان ، فبريق الاسنان وترتيلها ؛ كأنها حبات لُؤْلُؤٍ منظوم ، والعناية بها هو عنوان الشباب ، وناهيك عن اشراقة الابتسامة وما لها من القبول في القلوب والنفوس والعقول.</p><p><a href="../#s/m2904">افتح في شذرات</a></p></body></html>
