<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">ليس من مكارم الأخلاق، ولا صفات النبلاء، ولا شيم العلماء، الحجر على الآراء، التي ليس فيها ظلم ولا اعتداء، ولا إثارة للدهماء، ولا تشويش للصفاء، ونشر الجفاء بين الأصدقاء، ولا خير في الإرهاب الفكري، كما لا خير في الإرهاب الجسدي.</p><p><a href="../#s/m2480">افتح في شذرات</a></p></body></html>
