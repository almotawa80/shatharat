<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الأصل في الرجال الاقتصاد، والأصل في النساء الإسراف، فالإسراف في الرجال أقل من النساء، والاقتصاد في النساء أقل من الرجال. ولولا النساء لبارت السلع، أعطني عشر نسوة، أبني لك مجمعا تجاريا ناجحا.</p><p><a href="../#s/m2089">افتح في شذرات</a></p></body></html>
