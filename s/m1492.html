<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أقوى بواعث العناد والعصيان، والجحود والكفران: الجهل، واتباع الهوى، وإغراء الشهوات، والاغترار بالدنيا، وتأثير رفقاء السوء، وكبرياء النفس عن الحق، ووسوسة الشيطان… وهذه تجتمع فتغشي البصيرة، وتجرّ صاحبها لمعاداة طريق السلامة، وهو الإسلام.</p><p><a href="../#s/m1492">افتح في شذرات</a></p></body></html>
