<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إن الله سبحانه وتعالى قد مَكَّنَّا من اختيار المستقبل الصالح ، وجعله في مقدورنا ، فإذا أصلحنا أحوالنا في الحاضر ؛ فالله يُصلح أحوالنا في المستقبل ، ( إن الله لا يُغير ما بقوم حتى يُغيروا ما بأنفسهم ) فلنبادر بإصلاح أحوالنا الحاضرة ؛ ليتحقق لنا وعد الله ، والله لا يُخلف الميعاد.</p><p><a href="../#s/m3262">افتح في شذرات</a></p></body></html>
