<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">بعد زواج البنت، وانتقالها لبيت زوجها، يكون مبدأ الشوق، ومهوى الوَلَه، ومطلع اللهفة، ومورد السعادة الغامرة… إذ تعود في الزيارات لتلتقى بأمِّها وأخواتها وعائلتها، في العشِّ الذي فيه ترعرعت، ومنه درجت، وفي زواياه ذكرياتٌ ندية، وأحاديثٌ دافئة، وحنينٌ لا يزول.</p><p><a href="../#s/m1409">افتح في شذرات</a></p></body></html>
