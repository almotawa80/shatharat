<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لهذا شُرعت الحُدود: وقايةً قبل أن تكون عقوبة، وحمايةً قبل أن تكون إيلامًا، ورحمةً بالمجتمع قبل أن تكون شدّةً على الفرد. فهي لم تُشرَع لِتُكثِر التنفيذ، بل لِتُقلِّل الجريمة؛ إذ إن إقامةَ حدٍّ واحدٍ أبلغُ في الردع من ألف موعظة.</p><p><a href="../#s/m1326">افتح في شذرات</a></p></body></html>
