<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">صاحب الصالحين، فالصالح مع الصالح: إن غبت افتقدوك، إن مرضت جاؤوك، إن نجحت هنؤوك، إن فترت نشطوك، إن نسيت ذكروك، إن دعوا أشركوك، إن افتقرت أغنوك، إن احتجت أعانوك، إن أصبت شكروك، إن أخطأت سامحوك، إن دعوت أجابوك، إن سافرت ودَّعوك، إن حضرت استقبلوك، إن استنصرت نصروك.</p><p><a href="../#s/m2464">افتح في شذرات</a></p></body></html>
