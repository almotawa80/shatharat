<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">كن مع جلسائك مثل مُكعب السكر في الشاي، يُزيل عنه المرارة، ويمنحه الحلاوة ثم يختفي، فاجعل مجلسك حلوا بالعلم والحكمة والموعظة، والنوادر والأمثال والشذرات وقراضات الذهب، من غير أن تُظهر نفسك وتتميز عليهم.</p><p><a href="../#s/m2228">افتح في شذرات</a></p></body></html>
