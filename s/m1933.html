<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">قال جلساء معاوية رضي الله عنه: متى تحب أن ننفض من مجلسك ؟ قال: أمارة ذلك إذا قلت : إذا شئتم . وقال يزيد: إذا قلت: على بركة الله. وقال عبدالملك: إذا ألقيت الخيزرانة . وقال رجل من كبار العسكر: إذا قلت: يا غلام الغداء . وقلت أنا: لا تحرمونا من زيارتكم .</p><p><a href="../#s/m1933">افتح في شذرات</a></p></body></html>
