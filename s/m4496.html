<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">اتخذ كلبًا يحرس حقلك، وقطًّا يصيد فأرك، ولا تُودِع أحدًا أسرارك. واستر عن الناس أحوالك. وخذ حذرك من اثنين: جائعٍ جمع قرشين، وجاهلٍ حفظ سطرين؛ فهذا قد يشتري الناس بماله، وذاك يفتنهم بأقواله.</p><p><a href="../#s/m4496">افتح في شذرات</a></p></body></html>
