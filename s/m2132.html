<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">بعض المتقاعدين مثل الملح، إن غاب عن البيت، أصبح البيت هادئا، وإن حضر البيت رفع ضغطهم، فلا تكن منهم. بعض المتقاعدين مثل السكر، إن غاب عن البيت أصبح البيت مُرًّا، وإن حضر أصبح البيت حلوا، فكن أنت منهم. فأهل بيتك أولى الناس ببرك ومعروفك وإحسانك.</p><p><a href="../#s/m2132">افتح في شذرات</a></p></body></html>
