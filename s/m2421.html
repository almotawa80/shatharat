<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">يقول الأب المربي: لولا ربي ما عرفت ربي، ولولا ربي ما عرفت كيف أُربي، فتأديبي لأولادي في عَقلي لا في عِقالي، ونصحي في لساني لا في يدي وأسناني، لا أُطفئ شمعته، ولا أجرح سُمعته، ولا أدعس وردته، ولا أُشوه فطرته، ولا أكسر شوكته، بل أُوجهه كيف ومتى يشكها.</p><p><a href="../#s/m2421">افتح في شذرات</a></p></body></html>
