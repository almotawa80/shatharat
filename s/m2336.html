<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">حياة العلم بالمراجعة والمذاكرة والمناقشة والمجادلة والمواثبة والمساءلة والمجاوبة ويكون في إطار الإيجابيات والأدبيات والأخلاقيات ولين الجانب، بلا تجريح، لا بالتلميح ولا بالتصريح، ويكون في الأمور العلمية والمعرفية والثقافية.</p><p><a href="../#s/m2336">افتح في شذرات</a></p></body></html>
