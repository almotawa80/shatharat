<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا تُلغوا الاحتفالات المندوبات والمباحات ، بل ألغوا الإسراف والمبالغات، في جميع المناسبات ، فالاقتصاد والاعتدال في الاحتفالات والعادات ، أقرب إلى أحكام العقول وسنة الرسول ، والصلاة والسلام عليه موصول ، على مَرِّ العصور.</p><p><a href="../#s/m2853">افتح في شذرات</a></p></body></html>
