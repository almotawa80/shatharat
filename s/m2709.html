<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">المهم في قراءة القرآن التدبر والتفكر والتعقل ، ولا يبالغ في التفكر ويطيل ، حتى لا يجور الكيفُ على الكَمِّ ، وإذا لمعت بفكره خاطرة استنباطية فلا ينشرها حتى يتأكد من أهل الاختصاص ، أو يرجع إلى كتب التفسير ويتأكد من صوابها وصحتها ، حتى لا يجلب لنفسه الإثم والذم.</p><p><a href="../#s/m2709">افتح في شذرات</a></p></body></html>
