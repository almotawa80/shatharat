<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">عقيدة الوتساب أن الآراء تُعرض ولا تُفرض، والنقاش يكون باللين والآداب، لا بالعنف والسباب، وبالرفق لا بالإرهاب، وكن من المؤلفين لا من المنفرين، ولا تجعلوا بينكم فرجة يدخل منها الشياطين، لتُفسد عليكم الأُخوة في الدين.</p><p><a href="../#s/m2537">افتح في شذرات</a></p></body></html>
