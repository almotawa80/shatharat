<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أصحاب الاعتقادات الباطلة التي نشأوا عليها وورثوها عن آبائهم، لا يُحبون أن يسمعوا الحق لأنه يهدم اعتقاداتهم التي اعتنقوها منذ نعومة أظفارهم، فلا بد من تأليف قلوبهم وملاطفتهم والحكمة في اقناعهم، بالأدلة العلمية والبراهين العقلية.</p><p><a href="../#s/m2674">افتح في شذرات</a></p></body></html>
