<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">اقتراحُ الشيءِ على الكمالِ شيء سهلٌ، لكنَّ إيجاده على ذلك صعبٌ، فالتمنّي صفاءُ النَّفس، وأمّا نيلُ المُتمنّى فهو صفاءُ العَقل مع الجِدِّ، إذ بين الحُلمِ والبلوغِ مسافةُ جِدٍّ، لا يقطعُها إلا من جمعَ نُورَ الرؤيةِ إلى صبرِ السعي.</p><p><a href="../#s/m1197">افتح في شذرات</a></p></body></html>
