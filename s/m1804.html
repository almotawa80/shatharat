<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الإحسان إلى الناس أمارة التوفيق، والإساءة إليهم دليل الخذلان. فلا تندم على إحسان قدمته، ولا تفتخر بإساءة صدرت منك. ما أقبح المنّ بعد العطاء، وما أبشع التباهي بعد الإيذاء.</p><p><a href="../#s/m1804">افتح في شذرات</a></p></body></html>
