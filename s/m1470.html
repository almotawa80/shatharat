<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">ما عجزتَ عن جلبه من رزقٍ أتاك كما يأتيك المطر، لأنك لا تقدر على إنزاله فهو يأتيك. وما قدرتَ عليه فلا يأتيك وأنت قاعدٌ حتى لا تُصاب بداء العجزة. فمن وهبك العقل واليدين والرجلين فقد أمرك بالسعي لطلب الرزق أمرًا قدريًا.</p><p><a href="../#s/m1470">افتح في شذرات</a></p></body></html>
