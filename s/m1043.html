<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أثني على أحفاد حكيم في أدبهم وأخلاقهم، فقال : أنا أدبتهم وعلمتهم، فقيل له : كيف وأنت لم تساكنهم وتخالطهم، فقال : أنا أدبت آباءهم، وآباؤهم أدبوهم، فكأني أدبتهم.</p><p><a href="../#s/m1043">افتح في شذرات</a></p></body></html>
