<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أمران لا يتعلمهما الطفل، بل هما من الإلهام، ولولا ذلك لهلك فور خروجه من بطن أُمه. التنفس والرضاعة: الهواء والغذاء. والثالث: تَعَرُّفه على مصدر غذائه، وهذه في البهائم أًوضح، وفي علم الطب لو وضعت الأم وليدها على بطنها لزحف إلى صدرها.</p><p><a href="../#s/m2303">افتح في شذرات</a></p></body></html>
