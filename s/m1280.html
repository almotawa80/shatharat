<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الحرية تاجٌ على الرؤوس، لا يقدَّر بثمن ولا يُشترى بذهب، بها يشرق الوجه وتزدهر الحياة. فإذا أُسرت الأرواح خلف القضبان، ضاقت الأرض بما رحبت، وغدت القيود حدودًا وسدودًا، تكسر الإرادة وتطفئ الشعلة. الحرية حياة، والسجن موتٌ بطيء، فمن عاش بلا حرية فكأنما عاش بلا نفس ولا وجود.</p><p><a href="../#s/m1280">افتح في شذرات</a></p></body></html>
