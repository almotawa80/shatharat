<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إذا أردتَ مفتاحَ قلبِ المرأة التي تنوي خِطبتها، فحدِّثها عن محاسنها الأخلاقية والآدابية، وأثنِ على فضائلها، وأظهر تقديرك لشخصيتها؛ فإن القلوب تُفتح بالمديح والتقدير، أكثر مما تُفتح بالوعود بالهدايا والتبشير.</p><p><a href="../#s/m4424">افتح في شذرات</a></p></body></html>
