<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">ألذ الأشياء ما كان بعد الحرمان : ألذ الطعام ما أعقب الجوع الشديد، وألذ الشراب ما أعقب الظمأ، وألذ النوم ما أعقب السهر، وأطيب النكاح ما كان بعد عزوبة، وعلى هذا جميع ملاذ الدنيا.</p><p><a href="../#s/m626">افتح في شذرات</a></p></body></html>
