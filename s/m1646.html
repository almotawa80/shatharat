<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">كانت رائعة الجمال، في ريعان الشباب، فتقدَّم لها من قومها ثريٌّ مليٌّ أجنبي، فَسَأَلَتْهُ عن عمره، فقال: سبعون! فوافقت. فلما تزوَّجته، اكتشفت أنه في الخمسين، فثارت وغضبت، وطلبت منه الطلاق، إذ لم تكن تهوى شخصه، بل ترجو رحيله وميراثه!</p><p><a href="../#s/m1646">افتح في شذرات</a></p></body></html>
