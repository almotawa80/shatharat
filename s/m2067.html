<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">راكبو البحار دود على عود، فكبروا الله واذكروه في ثَبَجِ (وسط)البحر، تجلبوا الملائكة عليهم السلام، وتطردوا الشياطين، وذاكر الله جليس الرحمن، وجليس الرحمن أرجى أن يكون في أمان واطمئنان.</p><p><a href="../#s/m2067">افتح في شذرات</a></p></body></html>
