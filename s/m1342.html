<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إذا أردت أن تُقنع غيرك برأيك، فكن صادقًا في قولك، واضحًا في حجّتك، هادئًا في نبرتك، عارفًا بمن تخاطب، مستندًا إلى برهان واضح، ومحركًا للعقل والعاطفة معًا؛ فإن الإقناع لا يكون بالصوت العالي، ولا الحماس المتعالي، بل بالحجة والفطنة، والثقة ووضوح الأسلوب، وبيان الأدلة والدروب.</p><p><a href="../#s/m1342">افتح في شذرات</a></p></body></html>
