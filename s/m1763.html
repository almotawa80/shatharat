<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">رأي الشيخ يبدو خطأ في عين الشاب في الحاضر، ثم يتبين له أن رأي الشيخ صواب، ورأيه هو الخطأ، في المستقبل. لأن رأي الشيخ غالبا مبني على تجارب، والتجارب لا تكذب، ونتائجها يقينية. أما رأي الشاب فغالبا هو مبنى على العواطف والمشاعر الآنية، والتأثيرات السطحية، والحماسات الاندفاعية.</p><p><a href="../#s/m1763">افتح في شذرات</a></p></body></html>
