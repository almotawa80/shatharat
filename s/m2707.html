<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">طفولة الفقراء قصيرة ، لأنهم يباشرون الحِرف والمِهن والأعمال الشاقة وهم في ميعة صباهم ، ليساعدوا آباءهم على تكاليف الحياة الباهظة ، أما طفولة الأغنياء فطويلة لأن آباءهم ينفقون عليهم حتى يستكملوا دراساتهم : الابتدائية والمتوسطة والجامعية.</p><p><a href="../#s/m2707">افتح في شذرات</a></p></body></html>
