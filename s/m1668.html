<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">المرأة العاقلة الرزينة، إن أرادت أن تنعم بجنة الدنيا في حياتها الزوجية، وجنة الآخرة، فعليها بسباعية السعادة: سايريه بحكمة، ياسريه بلطف، ساهليه بكرم، سامحيه بجود، سانديه بثبات، ساسريه بحب، وسلفيه بجميل العطاء. فبهذه السباعية، تُبنى البيوت، وتدوم المودة، ويهنأ العيش.</p><p><a href="../#s/m1668">افتح في شذرات</a></p></body></html>
