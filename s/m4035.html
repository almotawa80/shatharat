<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من فَنِّ الدعاء أن يكون بكلمات متآلفة ، وجمل قصيرة ، ويكوة جامعا ومختصرا ، ليسهل نشره وحفظه ، وخير الدعاء ما ورد في الكتاب والسنة، ثم ما نُقل عن الصحابة والتابعين رضي الله عنهم أجمعين.</p><p><a href="../#s/m4035">افتح في شذرات</a></p></body></html>
