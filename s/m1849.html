<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">سبعة أدواء لا رجاء في الشفاء منها: الحماقة التي تُعمى البصيرة، والغباء الذي يُعجز العقل، والكسل الذي يُقيد الهِمَّة، والهَرَم الذي يُضعف الجسد، والتردُّد الذي يُبدد القرار، والتلون الذي يهدم الثقة، والوسواس الذي يُعكر صفو النفس.</p><p><a href="../#s/m1849">افتح في شذرات</a></p></body></html>
