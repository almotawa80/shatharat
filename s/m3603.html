<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">عندما أنقذ الراعي النعجة من براثن الذئب وأنيابه، ظنت أنه يحافط على حياتها، لكنه سارع في ذبحها حتى لا تموت من جراحات الذئب، مسكينة النعجة إن سلمت من فكي الذئب لم تسلم من فكي الإنسان.</p><p><a href="../#s/m3603">افتح في شذرات</a></p></body></html>
