<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من لم يكن عقله أكبر خصال الخير عنده، كان حتفه في أكبر خصال الخير عنده، فكرمه يصير إسرافا، وشجاعته تصير تهورا، وكلامه يصير هذرا، وصمته يصير عِيًّا، وهلم جرًّا.</p><p><a href="../#s/m2030">افتح في شذرات</a></p></body></html>
