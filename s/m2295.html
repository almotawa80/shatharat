<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا تحزنوا على من فارقكم من الأصحاب، لقد رحل إلى رب الأرباب، من هو خير له من والديه وأولاده والأحباب، من يغفر السيئات للمؤمنين ويُضاعف لهم الثواب، غفور رحيم، عفو حليم، غني كريم، يضاعف الحسنات، ويتجاوز عن السيئات، ويرحم الأحياء والأموات، وهو رب العرش والأرض والسموات.</p><p><a href="../#s/m2295">افتح في شذرات</a></p></body></html>
