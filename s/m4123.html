<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إن الله يبتلي عبده الصالح بالمرض، ثم يصبره ويفتح له باب الذكر والدعاء، والمرض للمؤمن صابون الذنوب ، وتطهير القلوب ، فإذا بدأ المرض يخف فأبشر بالصحة ، فالمرض يأتي متسارعا ، والصحة تأتي على مهل ، فإذا تَشَهَّى المريض الطعام فبشروه بالعافية ، والصحة من النعم العظيمة المنسية.</p><p><a href="../#s/m4123">افتح في شذرات</a></p></body></html>
