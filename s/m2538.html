<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من وهبك الصحة فقد وهبك النشاط، ومن وهبك النشاط فقد أعانك على العمل، ومن أعانك على العمل فقد رزقك، ومن رزقك فقد ملأ بطون أولادك وكسى ظهورهم، فالصحة نعمة منسية، وهي أعظم نعمة بعد الإيمان.</p><p><a href="../#s/m2538">افتح في شذرات</a></p></body></html>
