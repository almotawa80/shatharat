<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا تطلب العلم بالجهل، فلا تقصد العالم في غير وقته، ولا تتخطى إليه الرقاب، ولا تتعنت في السؤال، ولا تقل له قال فلان غير قولك، لا تذم عنده العلماء، ولا تغتب عنده أحدا.</p><p><a href="../#s/m233">افتح في شذرات</a></p></body></html>
