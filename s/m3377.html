<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">قال : أول ما مُنحت شهادة الدكتوراه ؛ كان كلما سمعت كلمة - دكتور - تلفت ظننت أني أنا المقصود ، فكنت في زيارة في أحد المزارع ، فسمعت من يقول : دكتور دكتور ، فالتفت وقلت : نعم ، فإذا هو يقول : ثور ثور ويشير إلى ثور ! فعندها خجلت من نفسي ، وأقلعت عن عادتي السخيفة</p><p><a href="../#s/m3377">افتح في شذرات</a></p></body></html>
