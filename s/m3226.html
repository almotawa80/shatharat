<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">س: كيف تكون قدوة لأهل بيتك ، وجيرانك وأصدقائك ، ولمجتمعك وللناس جميعا؟ ج : إذا جعلت النبي محمدا صلى الله عليه وسلم قدوتك في أقواله وأفعاله وأخلاقه وآدابه وعاداته ودعوته ، بقدر استطاعتك ، فقد أصبحت أنت قدوة حسنة لكل من تقدم ذكرهم ، بقولك وفعلك وأخلاقك وآدابك وعاداتك ودعوتك.</p><p><a href="../#s/m3226">افتح في شذرات</a></p></body></html>
