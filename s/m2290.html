<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الأصل في الأخلاق أنها حزم ومجموعات لا أفراد وأفذاذ، فإذا وجدت في رجل خصلة صالحة فتوقع أخواتها، والعكس صحيح، فإن كان صادقا فهو مخلص وأمين وثقة، وهلم جَرًّا، وإن كان كاذبا فهو مداهن ومراوغ وغير أمين ولا ثقة، وهلمَّ جرًّا، فنظام الأخلاق جمعي لا فردي.</p><p><a href="../#s/m2290">افتح في شذرات</a></p></body></html>
