<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الأخلاق تاجُ المرء، بها يعلو مقامه، وبدونها يسقط احترامه، هي جواز المرور إلى القلوب، وميزان التفاضل بين الشعوب، فالأخلاق ترفع الضعيف، وتُسقط القويّ إن حاد عن الطريق، فهي ميراث الأنبياء عليهم السلام، وزينة العقلاء، ورأس مال الحكماء، من تزين بها أكرمه الخالق، وأحبّه واحترمه الخلق.</p><p><a href="../#s/m1582">افتح في شذرات</a></p></body></html>
