<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">في أوائل شهر رمضان سترون وجوها جديدة في المساجد، فتبسموا في وجوههم، ولا يرون في وجوهكم الاستنكار أو الاستغراب، ولا تسألوهم أين كُنْتُم وما نراكم في المساجد إلا في شهر رمضان، فلا تعاتبوهم ولا تسخروا منهم، واحمدوا الله على نعمة الهداية.</p><p><a href="../#s/m1649">افتح في شذرات</a></p></body></html>
