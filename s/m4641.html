<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">القول إن «باي باي» معناها «في حفظ البابا» غير صحيح لغويًّا؛ فالقواميس الإنجليزية تردّها إلى bye وgoodbye بمعنى الوداع، و«bye-bye» تكرار عامّي للوداع. والأولى لنا تحية الإسلام: «السلام عليكم» عند الإقبال وعند الانصراف.</p><p><a href="../#s/m4641">افتح في شذرات</a></p></body></html>
