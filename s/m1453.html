<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الاستعجال في اتخاذ القرارات الجسيمة، والمبادرة إلى الأفعال العظيمة، وأنت في أتون انفعالٍ جامحٍ، قبل رويةٍ ونظرٍ في العواقب، سبيلٌ إلى الندامة ومظنّةٌ للحسرة. فالعجلة أمُّ الندامة، وبنتُ الخيبة، والقرار ابنُ الرويّة، وثمرةُ التأني والبصيرة.</p><p><a href="../#s/m1453">افتح في شذرات</a></p></body></html>
