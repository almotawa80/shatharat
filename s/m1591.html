<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">جميلٌ أن نختلفَ بأدب، ونعتذرَ باعتراف، ونعاتبَ برفق، ونلتقي بمودّة، ونفترقَ بسلام، ونجتمعَ ببشاشة، وننصحَ بلين، ونُنكرَ بلطف، ونغضبَ بحِلم، ونطلبَ بتواضع، ونردَّ بحكمة، ونُجيبَ بتؤدة، ونستأذنَ بحياء، ونُعاتبَ بحنان، ونحاورَ بهدوء، ونأمرَ برفق، ونُكرمَ بصمت، ونُعبّرَ ببصيرة.</p><p><a href="../#s/m1591">افتح في شذرات</a></p></body></html>
