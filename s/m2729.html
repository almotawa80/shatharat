<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا تُقنطوا الناس من رحمة الله الواسعة ومغفرته العظيمة ، فالحسنة بعشرة أمثالها وزيادة ، والسيئة بمثلها أو يغفر ، وإن الحسنات يُذهبن السيئات ، وإن رحمة الله غلبت وسبقت غضبه ، لا بد من الاعتدال في الترغيب والترهيب ، وترجيح الترغيب على الترهيب.</p><p><a href="../#s/m2729">افتح في شذرات</a></p></body></html>
