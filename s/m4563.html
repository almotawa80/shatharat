<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">كما نأكل التين الشوكي وننتفع بحلاوته ولا نغفل عن شوكه، ننتفع بالذكاء الاصطناعي وفوائده ولا نغفل عن مخاطره؛ نأخذ منه النافع، ونتحقق مما يقول، ونحفظ أسرارنا وخصوصياتنا. فالحكمة أن نأكل الثمار، ونتقي الأشواك.</p><p><a href="../#s/m4563">افتح في شذرات</a></p></body></html>
