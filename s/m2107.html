<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إن كانت نفسك التي بين جنبيك لا تستجيب لك في كل ما تريده منها، فكيف تريد من ابنك أن يستجيب لك في كل ما تريده منه. فعليك بالرفق واللين، والتجاوز والتسامح، ولا تُكثر اللوم والعتاب، فكثرة العتاب تفرق الأهل والأحباب.</p><p><a href="../#s/m2107">افتح في شذرات</a></p></body></html>
