<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">راقب أقوالك وأفعالك واحرص على ألا تجرح أحدا بقول وقِيح، أو فعل قبيح، أو نقد صريح، أو كلام غير مليح ، فإذا فعلت صرت قدوة لغيرك، وداعيا للخير بصمتك ، فانهالت عليك الحسنات ، ونلت المحبة والاحترام من الأفراد والجماعات ، وناهيك عما تكسب من الخيرات.</p><p><a href="../#s/m3892">افتح في شذرات</a></p></body></html>
