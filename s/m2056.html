<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من كرامة المؤمن عند الله، أنَّ الله أمره وأَذِن له أن يقف بين يديه في اليوم خمس مرات، يستقبل اللهَ بوجهه، ويستقبله اللهُ بوجهه، ويسأل الله ما يريد من خير الدنيا والآخرة، فيجيب الله دعاءه حالا أو مآلا، أو يدفع عنه من البلاء بقدره، ودعاء المؤن لا يُرد، تفضلا لا واجبا.</p><p><a href="../#s/m2056">افتح في شذرات</a></p></body></html>
