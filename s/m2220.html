<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أظن أن نشر الانتقادات الفردية المتبادلة بين الشعوب العربية في الوسائل الإعلامية ظاهرة غير صحية، وثمراتها سلبية، لأنها تصنع الكراهية والوحشة في القلوب بين الشعوب، ونحن في حاجة شديدة للؤلفة والمودة، بين الشعوب العربية والإسلامية، لأن التآلف قوة والتنافر ضعف.</p><p><a href="../#s/m2220">افتح في شذرات</a></p></body></html>
