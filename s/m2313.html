<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا تكن رأسا، فالرأس كثير الأوجاع، إن أحسنت إليهم حسدوك، وإن أخطأت لن يعذروك، وإن عاملتهم باللين استضعفوك، وإن عاملتهم بالحزم كرهوك، وإن كثر مالك اتهموك، ثم يوم القيامة ستُسأل عنهم إن خاصموك.</p><p><a href="../#s/m2313">افتح في شذرات</a></p></body></html>
