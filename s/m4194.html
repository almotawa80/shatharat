<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الديمقراطية ابتدعها من عندهم شريعة سماوية محرفة، وسار عليها من ليس لديهم شريعة سماوية، أما المسلمون فحسبهم هدي ربهم وسنة نبيهم، فنظامهم الشورى وتكون بين عقلاء القوم وصالحيهم أهل الخبرة والدراية والكفاية والكفاءة.</p><p><a href="../#s/m4194">افتح في شذرات</a></p></body></html>
