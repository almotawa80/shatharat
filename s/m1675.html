<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الحقيقة بنت البحث، المعرفة بنت التجربة، نمو العقل بزيادة المعرفة، الصواب ابن الخطأ، اليقين ابن الشك، اللغة بنت الاجتماع، السياسة بنت الاقتصاد، الاقتصاد ابن العمل، العمل ابن الصحة، الصحة بنت الاعتدال والنظافة والوقاية.</p><p><a href="../#s/m1675">افتح في شذرات</a></p></body></html>
