<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">تحذير خطير: لا تشمّ عطرًا من غريب، ولا تقبل مادة مجهولة؛ فقد يكون العطر ستارًا للخداع، والشمّ مدخلًا للأذى أو السرقة. حسن الظن قد يكون ورطة، وسوء الظن عند الريبة فطنة؛ فاحذر من لا تعرف، فقد يخبّئ الشر في فنونه، والخداع في مكنونه. فالاحتياط نجاة، والحذر حصانة، والوقاية خير من الندامة.</p><p><a href="../#s/m4605">افتح في شذرات</a></p></body></html>
