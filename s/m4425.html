<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">وبادروا بالزواج؛ فإن رُزقتَ زوجةً صالحةً سعدتَ بها وسَعِدتْ بك، وإن ابتُليتَ بأنَّانةٍ زنَّانةٍ، ثرثارةٍ سليطةٍ، ثم صبرتَ عليها، فإمّا أن تُصبحَ فيلسوفًا تُعلِّم الناس الحكمة، وإمّا صبورًا تُعلِّمهم فضيلة الصبر والتحمُّل!</p><p><a href="../#s/m4425">افتح في شذرات</a></p></body></html>
