<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أهم رسالة يُؤديها المعلم لطلابه ، أن يقوم بغرس حب القراءة والمعرفة والعلم والثقافة في عقول طلابه ، منذ المراحل الأولى ، لتُصبح لهم عادة وطبيعة ، فهذا هو سِرُّ تقدم الدول ، ومفتاح رُقي الشعوب.</p><p><a href="../#s/m2711">افتح في شذرات</a></p></body></html>
