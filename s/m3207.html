<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">حاجة التربية إلى الرحمة حاجة المريض إلى الدواء ، والعليل إلى الشفاء ، والعطشان إلى الماء ، فالله سبحانه عندما أثنى على نفسه بالربوبية أتبعها بصفة الرحمة في أول سورة الفاتحة ، فالملاينة في التربية خير من المخاشنة ، والمياسرة خير من المعاسرة.</p><p><a href="../#s/m3207">افتح في شذرات</a></p></body></html>
