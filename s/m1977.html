<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الناس يرحلون وتبقى ذكرياتُهم، فأحسنوا أعمالَكم وأخلاقَكم، تحسن ذكرياتُكم، والمسلمون شهداء الله في أرضه، وقول الحق على لسان الخلق، فمن أثنى عليه المسلمون خيرا فقد وجبت، ومن أثنى عليه المسلمون شرا فقد وجبت.</p><p><a href="../#s/m1977">افتح في شذرات</a></p></body></html>
