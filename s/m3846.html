<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">مُقَصِّرٌ حَسَنُ الأخلاق طيب العشرة واللقاء؛ أخف على الناس من عابد سيئ الأخلاق عابس اللقاء، لأن الأول تقصيره على نفسه، وحُسن أخلاقه للناس، والثاني عبادته لنفسه، وسوء أخلاقه على الناس، فكن صالحا حسن الأخلاق.</p><p><a href="../#s/m3846">افتح في شذرات</a></p></body></html>
