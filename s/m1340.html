<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">التجارة تقوم على الحساب لا على التمنّي، والربح الحقيقي يُصنع عند الشراء لا عند البيع، وحفظُ رأس المال مقدَّم على تنميته، والسيولة روحُ المشروع، ومن لا يُحسن الأرقام يخسر ولو كثرت مبيعاته.</p><p><a href="../#s/m1340">افتح في شذرات</a></p></body></html>
