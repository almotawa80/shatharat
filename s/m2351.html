<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إذا أردت أن تعرف أن فلانا ثقة، فثق به فيما ينفعه ولا يضرك، حتى يتبين لك أمره، فإذا قصَّر فيما ينفعه، فكيف لا يُقصر فيما ينفعك، فالاختيار بعد الاختبار.</p><p><a href="../#s/m2351">افتح في شذرات</a></p></body></html>
