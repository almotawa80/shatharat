<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا يَحسُن بالآمر بالمعروف والناهي عن المنكر أن يُكرِه الناس على اجتهاده، أو يُلزمهم بمذهبه، فإنما وظيفته أن يُبيّن الحق بدليله، ويُرشد برفقه ولينه، ويُغيّر ما أُجمِع على إنكاره، أو ثبت بالنص تحريمه وإحداثه، أمّا المختلف فيه فمجاله السعة، وميدانه العذر، ومقامه الرحمة.</p><p><a href="../#s/m1286">افتح في شذرات</a></p></body></html>
