<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">المؤمن إنسان يُحب الشهوات طبعا، لكنه يترك ما حرم الله منها إيمانا واحتسابا، وينفر من المكاره طبعا، لكنه يفعل ما يُحبه الله منها: كالجهاد والإنفاق إيمانا واحتسابا.</p><p><a href="../#s/m4265">افتح في شذرات</a></p></body></html>
