<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من حسن اختيار الرجل زوجة له، أن يختارها أصغر منه، لأنه إذا جاوز الستين، احتاج في شؤونه إلى المرافق والمعين، فزوجته خير من تقوم بهذا الدور، وهي تشعر بالسعادة، لأنها بهذا العمل تعبر عن حبها وتقديرها لزوجها، وأن هذا سوف يزيد في قربه وتقديره وحبه لها.</p><p><a href="../#s/m1761">افتح في شذرات</a></p></body></html>
