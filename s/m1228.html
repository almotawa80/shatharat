<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من أعاجيب الإنسان المدهشة! وغفلته الموحشة، يبذل جهده، ويسخّر ما أنعم الله به عليه لتزيين دنياه الفانية وزخرفتها، ويغفل كلية عن آخرته الباقية، فيبالغ هنا ويقصّر هناك، كمن يُجيد ويتفنن في تزيين وتجميل فندقه الذي سيمكث فيه يومين فقط، ويُهمل بيته الذي سيقيم فيه عمره كلّه.</p><p><a href="../#s/m1228">افتح في شذرات</a></p></body></html>
