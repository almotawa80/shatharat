<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">من بالغ في التدقيق حُرِم التوفيق، تغافل تُسْعَد، وتجاوز تُحَب، فليس كل فعل يُفسَّر، ولا كل قول يُحاسَب، ولا كل زلّة تُعاتب، أجمل الرد: الصمت، وأكمل العقل: الحِلم والعفو، فمحبة الناس كنز عظيم فلا تزهد فيه، ولا تفرط فيه.</p><p><a href="../#s/m1355">افتح في شذرات</a></p></body></html>
