<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">متاع الدنيا قليل، والذي بقي منها قليل، والذي لك منها قليل، وقليلك أقل القليل، فأشغل نفسك بما قال الله وقال الرسول، ودع عنك القال والقيل، فكله ضئيل، وإلى زوال يفنى ويزول.</p><p><a href="../#s/m1705">افتح في شذرات</a></p></body></html>
