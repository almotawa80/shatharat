<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">ميدان الحروب يزخر بالإرجافات، والإشاعات، والتزوير، والافتراء، فلا تُصدقوا كل ما تسمعون، ولا تُكذبوا كل ما يُنشر، ولا تنشروا كل ما يُقال، حتى تستبينوا الحق وتتحققوا من اليقين.</p><p><a href="../#s/m1989">افتح في شذرات</a></p></body></html>
