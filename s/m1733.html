<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">جاء. رجل إلى الشيخ الألباني يدَّعي علم الغيب ويطلب مناظرته . فقال الشيخ: أناظرك ولكن بشرط . فقال الرجل : ما هو شرطك؟ قال الشيخ: كيف تعلم الغيب ولا تستطيع معرفة شرطي؟ فانتهت المناظرة .</p><p><a href="../#s/m1733">افتح في شذرات</a></p></body></html>
