<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">المسافر يوم السفر كأنه أُم العروسة فاضية ومشغولة، ومن حرصه ألا ينسى شيئا قد ينسى بعض الأشياء، وابن الستين والسبعين يشبه المسافر يوم السفر، فعليه أن يُكثر من الصدقات والأعمال الصالحات، ويؤدي الزكاة ويحج</p><p><a href="../#s/m2059">افتح في شذرات</a></p></body></html>
