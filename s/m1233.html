<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">حين يتقدّم بك العمر ستندم على قسوتك، حين وجب اللين، وعلى صمتك حين وجب القول، وعلى وقتٍ ضاع بين مالٍ وعمل، وعلى والِدَين وأولاد لم تنعم بقربهم، وعلى خيرٍ أخّرته حتى فات، ياليت الزمان يعود يوما، لأتدارك ما فاتني دوما.</p><p><a href="../#s/m1233">افتح في شذرات</a></p></body></html>
