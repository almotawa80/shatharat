<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">رجل خليجي عَلَّم رجلا أجنبيا عمليا ، كيف يفحص البِطيخة ( الرقية ) بواسطة الطَبْطَبَة عليها قبل اختيارها ، فتعجب من مهارته ، فقال له : لماذا لا تُطبطبون على المسؤولين عندكم قبل اختيارهم ، فقال له : ما يصلح ، لأن البِطيخة تُخبرك بالحقيقة من غير خداع ولامراوغة ولا تزوير</p><p><a href="../#s/m3096">افتح في شذرات</a></p></body></html>
