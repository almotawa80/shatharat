<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">النصيحة الذهبية للموظف الجديد: أخلص العمل، واضبط الوقت، وأتقن المهام، وتعلّم بعينيك ولسانك وأُذنيك، واطلب العون بلطف، واحترم النظام، وحافظ على الأخلاق، ووسّع علاقاتك الإيجابية، وكن صبورًا مثابرًا، فهذه مفاتيح النجاح والرفعة.</p><p><a href="../#s/m1511">افتح في شذرات</a></p></body></html>
