<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أحسنوا الظن بالله الغفور الرحيم، فالتوبة تجب ما قبلها، واجتناب الكبائر يكفر الصغائر، والحسنات يُذهبن السيئات، والوضوء والصلاة تكفر السيئات، وفضل الله أعظم، ورحمته أقرب وأوسع.</p><p><a href="../#s/m2236">افتح في شذرات</a></p></body></html>
