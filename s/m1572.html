<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">حب الدنيا فطرة، وحب الآخرة إيمان، ولولا حب الدنيا لخربت الدنيا ولم تعمر، وحب الدنيا لا يلحقه ذم ولا إنكار، لكن إيثار الدنيا على الآخرة هو المنهي عنه والمذموم.</p><p><a href="../#s/m1572">افتح في شذرات</a></p></body></html>
