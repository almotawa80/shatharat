<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">قال للطبيب النفسي : كل ليلة أرى في المنام أن الحمير يلعبون كرة قدم ! قال الطبيب : جرب الليلة لا تنم . قال : لا أقدر الليلة بالخصوص ! قال له لماذا : قال : الليلة المباراة النهائية للدوري !</p><p><a href="../#s/m3041">افتح في شذرات</a></p></body></html>
