<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إذا الشعب يوما أراد الحياة ، فلا بد أن نُخَفِّض الأسعار ، ونحميه من القروض وجشع التجار ، ونضرب بيد من حديد على من يعبث بأمن الوطن من الفجار ، ونتناصح ببن الكبار ، ونحسن تربية الصغار ، ونتعاون من جميع الأعمار ، على البر والتقوى والتقدم والازدهار.</p><p><a href="../#s/m3965">افتح في شذرات</a></p></body></html>
