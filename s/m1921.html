<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إذا قطعت الإساءة عن غيرك، فابدأه بالإحسان. فكل إحسان تبادر به إلى الناس هو في المآل إحسان إلى نفسك، وكل إساءة تبتدر بها غيرك هي في الحقيقة إساءة إلى نفسك. وإذا أحسنت، فتواضع، وإذا أسأت، فبادر بالاعتذار والاستغفار. فما أبهى أن تبدأ بالإحسان وما أجمل أن تنتهي بالتواضع.</p><p><a href="../#s/m1921">افتح في شذرات</a></p></body></html>
