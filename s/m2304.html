<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا يصيب الرامي غرة الهدف إلا بعد تكرار الخطأ، فالصواب ابن الخطأ، والتكرار باب من أبواب تعليم الصغار والكبار، ومن تردد في شيء آتاه الله حكمته، وكشف له أسراره وعلته، والتعليم توسع عمودي، والثقافة توسع أُفقي.</p><p><a href="../#s/m2304">افتح في شذرات</a></p></body></html>
