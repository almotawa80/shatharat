<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">كثير من الناس ميّالون إلى التهويل والمبالغة والتفخيم، فيعرضون آراءهم في صورة قطعية إلزامية، لا تقبل نقاشًا ولا تدقيقًا، ولا تعقيبًا ولا تمحيصًا، وعند المراجعة والتدقيق، يظهر الأمر خلاف ذلك، فعلى الإنسان أن يجعل له خط رجعة ومراجعة، ولا يُبالغ في الجزم، وفوق كل ذي علم عليم.</p><p><a href="../#s/m1514">افتح في شذرات</a></p></body></html>
