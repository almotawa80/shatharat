<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا تَكرهي زوجك لتقصيره وعيوبه، واصبري واحتسبي، ولا تَكره زوجتك لتقصيراتها وعيوبها، فاصبر واحتسب، فما من بشرٍ إلا وفيه نقص، والمعروض من النوعين غالبًا غير كاملٍ ولا مُرضي، فمن رضي عاش هانئًا، ومن دقّق تعب، ومن صبرَ ظفر، ومن شكرَ استبشر.</p><p><a href="../#s/m1224">افتح في شذرات</a></p></body></html>
