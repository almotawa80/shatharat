<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إذا أيقنت بأن الله تعالى هو الذي يُدبر أمر الكون وما فيه ؛ وهو الذي يُدبر أمر حياتك ، فما عليك إلا أن تقوم بعمل ما تقدر عليه ، ودع الباقي على الله ، ولا تفكر فيه كثيرا ، ولا تحمل همه ، فهذا سوف يريح عقلك وقلبك ونفسك وبدنك.</p><p><a href="../#s/m3258">افتح في شذرات</a></p></body></html>
