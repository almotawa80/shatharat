<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">ما أفلح من أفلح إلا بصحبة من أفلح، وما خسر من خسر ألا بصحبة من خسر. فالصاحب ساحب، والصديق مثل المصعد إما تصعد به، وإما أن تهوي به. فصاحب ذا الأخلاق الحميدة، ولا تصاحب ذا الأخلاق الرديئة، فإن الطباع تُعدي.</p><p><a href="../#s/m2476">افتح في شذرات</a></p></body></html>
