<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">القصص يشوبها المبالغات والتهويلات ، وفي الغالب ليس لها أسانيد معتبرة ، ولا تخلو من الوهن والضعف ، وقد يكون في طياتها مخالفات شرعية أو عقلية، فلا تتحمسوا في قبولها وتصديقها، وحسبكم أن تأخذوا منها العبرة والموعظة ، وعليكم بالقصص القرآنية ، والقصص الثابتة بالسنة النبوية.</p><p><a href="../#s/m3267">افتح في شذرات</a></p></body></html>
