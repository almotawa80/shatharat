<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">ما أروع وأبدع منشورات الصالحين، وتغريدات العلماء والحكماء والملهمين، في وسائل التواصل الاجتماعي وغيرها، هذا يذكرك بآية، وآخر بحديث، وثالث يهديك فائدة، ورابع ينصحك ويرشدك، وهلم جرَّا. فبدونهم لا طعم للمواقع ولا فائدة من المنشورات،</p><p><a href="../#s/m1276">افتح في شذرات</a></p></body></html>
