<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لا تعتمدوا على الوتساب في اقتراح العلاجات والوصفات، فالوتسابُ يُحاول أن يُقتعك في توصيف العلاجات والتوصيات، لكنه رديءٌ في تشخيص الحالات والتوقعات؛ يُجيد النصح من بعيد، ويُخفق عند الاختبار والنتائج غالبا، فاحذروا وصفات الوتساب، ولا تبادروا في تطبيقها.</p><p><a href="../#s/m1218">افتح في شذرات</a></p></body></html>
