<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">ديكه قفز على الحائط ثم قفز على السطح ، وما زال يقفز ويطير حتى فقده ، فرفع طرفه إلى السماء وقال : اللهم لا تجعله في يد عالم ولا يد فاجر ، فتعجبوا من دعائه ، فقال : العالم يُحَلِّلُها ، والفاجر يَسْتَحِلها</p><p><a href="../#s/m3314">افتح في شذرات</a></p></body></html>
