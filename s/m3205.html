<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أيها الناس اسمعوا صوت الحكمة بجميع الحواس ، أول ما يبدأ في السمكة العطب والخياس ، في الخاشيم والراس ، ثم يسرى إلى سائر جسدها بالتماس ، فاختاروا رؤساءكم من المشهورين بالكفاءة والأمانة ، والصدق والرزانة ، والأخلاق والديانة ، والنشاط في أوانه ويزن الحق بميزانه.</p><p><a href="../#s/m3205">افتح في شذرات</a></p></body></html>
