<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">أصحاب المهن والحرف التي يجهل المواطن أسرارها وأسعار أدواتها، كإصلاح الأجهزة الكهربائية والتقنية وغيرها، يجدون فرصة سانحة للغش والخداع، مستغلين جهل الطرف الآخر. فإياكم أن تغتروا بالكلام المعسول، إذ يصعب الاحتراز من مكرهم وخداعهم.</p><p><a href="../#s/m1956">افتح في شذرات</a></p></body></html>
