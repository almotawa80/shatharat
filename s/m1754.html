<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">لولا اختلاف الأذواق لبارت السلع في الأسواق، ولولا اختلاف الأذواق لبارت بعض النساء، ولولا اختلاف الأذواق لكسدت التجارة في الأسواق، وفي اختلاف الأذواق توسيع دائرة الأرزاق، وليس من الذوق مناقشة الذوق.</p><p><a href="../#s/m1754">افتح في شذرات</a></p></body></html>
