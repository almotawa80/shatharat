<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إن الله جلت حكمته وعظمت رحمته ؛ مَكَّنَ عبده من تغيير الماضي السيء إلى حسن : بالإيمان بعد الكفران ، وبالتوبة والاستغفار ، والكفارات والقضاء ورد الحقوق لأهلها . فالبدار البدار قبل فوات الأوان ، وانقضاء فترة الزمان، وحلول مَنِيِّة الإنسان.</p><p><a href="../#s/m3266">افتح في شذرات</a></p></body></html>
