<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الفرس تنقاد لفارسها ولو اقتحم بها معمعة المعارك ، واختلاف الرماح والسيوف ، فكان الأجدر بالإنسان العاقل أن ينقاد لأوامر ربه ، من انقياد هذا البهيم الأعجم لصاحبه ، فإن الحصان البهيم لصاحبه سميع مُطيع ، وإن الإنسان الفهيم لربه كنود عنيد.</p><p><a href="../#s/m2779">افتح في شذرات</a></p></body></html>
