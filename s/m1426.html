<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">تاجرٌ كبير يملك معرضًا عامرًا بالبضائع الواردة إليه من كل صوب، وله مديرٌ ناصحٌ أمين، بارعٌ في عمله غاية البراعة، يدفع له صاحب المعرض مليون دينار في السنة. فعجب أصحابه من كِبَر الأجرة، فقال لهم: إنه يُكسبني في العام أحد عشر مليونًا وأنا مطمئنٌ مستريح، فأدفع له مليونًا، وأحظى بعشرة.</p><p><a href="../#s/m1426">افتح في شذرات</a></p></body></html>
