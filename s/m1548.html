<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الحياة مدرسةٌ كبرى، دروسها التجارب، والإنسان فيها يتعلّم من نجاحه كما يتعلّم من إخفاقه؛ فكل تجربة تزيده خبرة، وتمنحه عبرة، وتقوّي عزيمته. ثم يجعلها الله سبيلاً لتيسير أمره، وشرح صدره، وتعويضه خيرًا مما فاته أو أُخذ منه.</p><p><a href="../#s/m1548">افتح في شذرات</a></p></body></html>
