<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">إذا ارتقى الإمام المنبر ، والتفت إلى المصلين ، بوجه عابس يابس آيس ، ونطح الخُطبة بقول : ( قل اللهم مالك الملك ، تؤتى الملك من تشاء ، وتنزع الملك ممن تشاء) فتوقع أن هذه آخر خُطبة ، وأن الوزارة قد أنهت خدماته</p><p><a href="../#s/m2931">افتح في شذرات</a></p></body></html>
