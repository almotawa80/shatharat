<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">هم يدافعون عن حرية التعبير لكنهم يحاربون حرية الاعتقاد هم يشددون على الرأفة بالحيوان لكنهم بصنعون أسلحة تبيد الإنسان هم يدافعون عن حقوق المرأة لكنهم يحاربون الشعوب فيبيدون الرجال ويجعلون النساء أرامل والأطفال أيتام هذا ديدنهم ومكرهم في قلب الحقائق، وهلم جراً.</p><p><a href="../#s/m2673">افتح في شذرات</a></p></body></html>
