<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">العبث بتغيير خِلقة الله في الظاهر أو الباطن؛ الأصل فيه عدم الجواز عقلا وشرعا وصحة، إلا للضرورة القصوى، وزيادة الوزن علاجها بتقليل الوجبات كما وكيفا، واتباع القواعد الصحية في عادات الطعام والشراب، لا بالعبث بخلقة الله، طمعا في تحقيق الهدف السريع، والكسب السريع.</p><p><a href="../#s/m2058">افتح في شذرات</a></p></body></html>
