<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">العلاقات بين البشر ترتكز أساسًا على المصالح والمنافع المتبادلة، وتزدهر بحسن التعامل، وصدق المودة، وجودة العطاء. أما الإيمان والتقوى، فهي علاقة خاصة بين العبد وربه، لا تتأثر كثيرا بما بين الخلق من معاملات دنيوية.</p><p><a href="../#s/m1842">افتح في شذرات</a></p></body></html>
