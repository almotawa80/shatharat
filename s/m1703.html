<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">جنِّبوا الواتساب ما يزرع الشقاق ويؤجِّج النزاع، وما يفسد الودَّ ويمزِّق الوفاق، من سبابٍ وعنفٍ وسوء أخلاق، وألفاظٍ جافيةٍ غليظة، ومعانٍ سقيمةٍ ووضيعة، وخشونةٍ رعناء، ورعونةٍ عمياء، وسفاهةٍ هوجاء، وأظافرَ هرٍّ عابثة، وكلماتٍ هزيلةٍ وهابطة.</p><p><a href="../#s/m1703">افتح في شذرات</a></p></body></html>
