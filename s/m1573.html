<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">المال يُهلكه الإسراف، والتباهي بالمظاهر، ويُنميه الاقتصاد والاقتصار على الحاجات، فدعوا المظاهر الخدَّاعة، وعُودوا للبَساطة والقناعة، فالعاقل من ملك حاجاته، لا من ملكته الكمالياتُ والمباهاةُ.</p><p><a href="../#s/m1573">افتح في شذرات</a></p></body></html>
