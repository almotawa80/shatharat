<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الحركات العضلية في أثناء الصلاة، والمشي إلى المساجد في النهار والظلمات، تحافظ على الصحة النفسية، واللياقة البدنية، وتزيد في التقرب إلى رب البرية، وتضاعف في الحسنات، وترفع الدرجات، وتكسب بها رضا رب الأرض والسماوات، وتدخل بها نعيم الجنات الخالدات.</p><p><a href="../#s/m2363">افتح في شذرات</a></p></body></html>
