<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">عندما ابتليت، علمت أن الله لم يبتلني قبل ذلك، ولا أكثر من ذلك، ولا في غير ذلك، ورجوت أن يرفعه عني، فأعانني ذلك على الصبر، وصرت من الشاكرين لا الشاكين.</p><p><a href="../#s/m776">افتح في شذرات</a></p></body></html>
