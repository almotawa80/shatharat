<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">مهما قال الناس والعلماء ، من الأذكار والدعاء ، في الصباح والمساء ، تبقى الأذكار المأثورة عن سيد الأنبياء ، عليهم الصلاة والسلام هي الأولى في الاقتداء ، والأفضل في جلب الخير ودفع البلاء ، فقد أُوتي جوامع الكلم وفواتحه وخواتمه من رب السماء.</p><p><a href="../#s/m2712">افتح في شذرات</a></p></body></html>
