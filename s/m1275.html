<body style="font-family:serif;text-align:center;padding:40px"><p style="font-size:1.4rem">الحياة هي المدرسة الكبرى، فمسيرة الحياة مليئة بالتجارب، فيها الصواب وفيها الخطأ، والصواب ابن الخطأ، ونتيجة التجارب لا تُخطئ، ودلالتها يقينية، فاطلب العلم النظري من علمائه، واطلب العلم العملي والصناعي والتجريبي من علمائه.</p><p><a href="../#s/m1275">افتح في شذرات</a></p></body></html>
